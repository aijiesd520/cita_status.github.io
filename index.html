<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cita Previa 4010 放号监控</title>
<style>
  :root {
    --bg: #0b0f19;
    --bg-subtle: #111827;
    --card: #151e32;
    --card-hover: #1c2742;
    --line: #22304d;
    --line-subtle: #1a253c;
    --txt: #f1f5f9;
    --mut: #94a3b8;
    --accent: #10b981;
    --accent-glow: rgba(16, 185, 129, 0.25);
    --cw: 12px;
    --cg: 2px;
    --lw: 96px;
    --g1: #9be9a8; --g2: #6cc675; --g3: #40c463; --g4: #2da44e; --g5: #1a7f37; --g6: #116329;
    --ce: #ef4444; --cn: #22304a; --cx: #141c2c;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
  }

  @media (max-width: 768px) {
    :root {
      --cw: 10px;
      --cg: 1.5px;
      --lw: 78px;
    }
  }

  * { box-sizing: border-box; }
  html, body {
    max-width: 100%;
    overflow-x: hidden;
  }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--txt);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  header {
    margin-bottom: 12px;
  }
  h1 {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -0.3px;
    color: #f8fafc;
  }
  .sub {
    font-size: 13px;
    color: var(--mut);
    font-weight: 400;
    margin-left: 6px;
  }
  #meta {
    font-size: 13px;
    color: var(--mut);
    margin: 4px 0 12px;
  }

  /* Control buttons & header links */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
    align-items: center;
  }
  button, .gh-link {
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: var(--radius-sm);
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
    color: var(--txt);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    transition: all 0.15s ease;
  }
  button:hover, .gh-link:hover {
    background: var(--card-hover);
    border-color: #3b82f6;
  }
  button.on {
    background: #2563eb;
    color: #fff;
    border-color: #2563eb;
  }

  /* Active appointment glowing banner */
  @keyframes pulse-glow {
    0%, 100% {
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.4), inset 0 0 8px rgba(16, 185, 129, 0.2);
      border-color: rgba(16, 185, 129, 0.8);
    }
    50% {
      box-shadow: 0 0 32px rgba(16, 185, 129, 0.8), inset 0 0 16px rgba(16, 185, 129, 0.4);
      border-color: #10b981;
    }
  }
  #banner {
    display: none;
    background: linear-gradient(135deg, #065f46 0%, #047857 100%);
    color: #fff;
    border: 1px solid #10b981;
    border-radius: var(--radius-md);
    padding: 12px 18px;
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 14px;
    animation: pulse-glow 2.5s infinite ease-in-out;
    word-break: break-word;
    overflow-wrap: anywhere;
  }
  #banner a {
    color: #fff;
    text-decoration: underline;
    margin-right: 14px;
    transition: opacity 0.2s;
  }
  #banner a:hover {
    opacity: 0.85;
  }

  #stale {
    display: none;
    background: rgba(245, 158, 11, 0.12);
    color: #fbbf24;
    border: 1px solid #d97706;
    border-radius: var(--radius-md);
    padding: 10px 14px;
    font-size: 13px;
    margin-bottom: 14px;
  }

  /* Filters toolbar */
  .filter-toolbar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 10px 14px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }
  .filter-group {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    max-width: 100%;
  }
  .filter-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--mut);
    white-space: nowrap;
  }
  .segmented-control {
    display: inline-flex;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 2px;
    gap: 4px;
    min-width: 0;
    max-width: 100%;
    flex-wrap: wrap;
  }
  .pill {
    border: none;
    background: transparent;
    color: var(--mut);
    border-radius: 4px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .pill:hover {
    color: var(--txt);
    background: rgba(255, 255, 255, 0.05);
  }
  .pill.on {
    background: #2563eb;
    color: #fff;
    font-weight: 600;
  }

  /* Analytics section */
  .analytics-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 16px;
  }
  .analytics-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 16px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
  }
  .golden-card {
    border-left: 4px solid var(--accent);
  }
  .golden-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .golden-title {
    font-size: 15px;
    font-weight: 700;
    color: #f8fafc;
  }
  .golden-badge {
    background: rgba(16, 185, 129, 0.15);
    color: #34d399;
    border: 1px solid rgba(16, 185, 129, 0.3);
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
  }
  .golden-desc {
    font-size: 12px;
    color: var(--mut);
    margin-bottom: 10px;
  }
  .golden-window {
    font-size: 22px;
    font-weight: 800;
    color: #f8fafc;
    margin: 4px 0 8px;
    letter-spacing: -0.5px;
  }
  .golden-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }
  .stat-pill {
    background: var(--bg-subtle);
    border: 1px solid var(--line-subtle);
    padding: 4px 8px;
    border-radius: var(--radius-sm);
    font-size: 12px;
  }
  .stat-label {
    color: var(--mut);
    margin-right: 4px;
  }
  .stat-val {
    font-weight: 700;
    color: #f1f5f9;
  }
  .conf-tier-high { color: #34d399; }
  .conf-tier-medium { color: #fbbf24; }
  .conf-tier-low { color: #94a3b8; }
  .golden-tip {
    margin-top: auto;
    font-size: 11px;
    color: var(--mut);
    background: rgba(255, 255, 255, 0.02);
    border-top: 1px dashed var(--line);
    padding-top: 8px;
  }

  .chart-card {
    border-left: 4px solid #38bdf8;
  }
  .chart-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }
  .chart-title {
    font-size: 15px;
    font-weight: 700;
    color: #f8fafc;
  }
  .chart-subtitle {
    font-size: 12px;
    color: var(--mut);
    margin-bottom: 8px;
  }
  .chart-svg-wrap {
    width: 100%;
    margin-top: auto;
  }
  .chart-svg {
    width: 100%;
    height: auto;
    display: block;
    overflow: visible;
  }
  .chart-bar {
    transition: opacity 0.15s ease;
    cursor: pointer;
  }
  .chart-bar:hover {
    opacity: 0.8;
  }

  .empty-notice {
    padding: 24px 16px;
    text-align: center;
    color: var(--mut);
    margin: auto 0;
  }
  .empty-icon {
    font-size: 26px;
    margin-bottom: 4px;
  }
  .empty-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--txt);
    margin-bottom: 2px;
  }
  .empty-desc {
    font-size: 12px;
    color: var(--mut);
  }

  /* Real-time KPI Cards */
  #cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 14px;
    margin-bottom: 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 14px 16px;
    box-shadow: var(--shadow);
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .card:hover {
    transform: translateY(-2px);
    border-color: #3b82f6;
  }
  .card.ok {
    border-color: var(--accent);
    background: linear-gradient(180deg, rgba(16, 185, 129, 0.08) 0%, var(--card) 100%);
    box-shadow: 0 4px 20px rgba(16, 185, 129, 0.15);
  }
  .card.err {
    border-color: var(--ce);
  }
  .card .head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .card .name {
    font-size: 16px;
    font-weight: 700;
    color: #f8fafc;
  }
  .card .at {
    font-size: 12px;
    color: var(--mut);
  }
  .card .state {
    font-size: 17px;
    font-weight: 700;
    margin: 8px 0 4px;
    color: var(--mut);
  }
  .card.ok .state { color: #34d399; }
  .card.err .state { color: #f87171; }
  .card .det {
    font-size: 13px;
    line-height: 1.5;
    color: #cbd5e1;
  }
  .capsule-earliest {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 3px 8px;
    font-size: 12px;
    font-weight: 600;
    color: #f1f5f9;
    margin: 4px 0 6px;
    max-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .capsule-earliest.ok {
    background: rgba(16, 185, 129, 0.12);
    border-color: rgba(16, 185, 129, 0.35);
    color: #34d399;
  }
  .offices-container {
    margin-top: 4px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-width: 100%;
  }
  .offices-row {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    align-items: center;
    max-width: 100%;
  }
  .office-tag {
    display: inline-flex;
    align-items: center;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 2px 7px;
    font-size: 11px;
    color: #cbd5e1;
    max-width: 100%;
    word-break: break-word;
    overflow-wrap: anywhere;
  }
  .office-btn {
    display: inline-flex;
    align-items: center;
    background: rgba(59, 130, 246, 0.12);
    border: 1px solid rgba(59, 130, 246, 0.3);
    color: #60a5fa;
    border-radius: var(--radius-sm);
    padding: 2px 7px;
    font-size: 11px;
    cursor: pointer;
    line-height: 1.4;
    transition: all 0.15s ease;
  }
  .office-btn:hover {
    background: rgba(59, 130, 246, 0.22);
    color: #93c5fd;
  }
  .offices-collapse {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 2px;
    max-width: 100%;
  }
  .card .last {
    font-size: 12px;
    color: var(--mut);
    margin-top: 8px;
    border-top: 1px dashed var(--line);
    padding-top: 8px;
  }

  @keyframes radar-ripple {
    0% {
      transform: scale(0.9);
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
    }
    70% {
      transform: scale(1.1);
      box-shadow: 0 0 0 8px rgba(16, 185, 129, 0);
    }
    100% {
      transform: scale(0.9);
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
    }
  }
  .radar-ripple {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #10b981;
    margin-right: 6px;
    vertical-align: middle;
    animation: radar-ripple 1.8s infinite ease-out;
  }

  /* Legend */
  #legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    font-size: 12px;
    color: var(--mut);
    margin: 0 0 12px;
    align-items: center;
  }
  .leg-scale {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .sw-grad {
    display: inline-block;
    width: 64px;
    height: 11px;
    border-radius: 2px;
    margin: 0 4px;
    vertical-align: -1px;
    background: linear-gradient(to right, var(--g1), var(--g2), var(--g3), var(--g4), var(--g5), var(--g6));
  }
  .sw {
    display: inline-block;
    width: 11px;
    height: 11px;
    border-radius: 2px;
    margin-right: 4px;
    vertical-align: -1px;
    background: var(--cx);
  }

  /* Interactive Tooltip & Popover */
  #cellinfo {
    display: none;
    background: #1e293b;
    color: #f8fafc;
    border: 1px solid #334155;
    border-radius: var(--radius-md);
    padding: 10px 14px;
    font-size: 13px;
    margin-bottom: 12px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    word-break: break-word;
    overflow-wrap: anywhere;
  }

  /* Heatmap board & sticky scroll container */
  .city {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 14px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
    max-width: 100%;
  }
  .chead {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 10px;
    color: var(--txt);
  }
  .heatmap-scroll-wrap {
    width: 100%;
    max-width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
    padding-bottom: 4px;
  }
  .heatmap-grid {
    min-width: fit-content;
  }
  .row {
    display: flex;
    align-items: center;
    margin-bottom: var(--cg);
  }
  .rlabel {
    flex: none;
    width: var(--lw);
    font-size: 12px;
    color: var(--mut);
    white-space: nowrap;
  }
  .rlabel.sticky-col {
    position: sticky;
    left: 0;
    z-index: 4;
    background: var(--card);
    padding-right: 6px;
  }
  .row.today .rlabel {
    color: var(--accent);
    font-weight: 700;
  }
  .cells {
    display: grid;
    grid-template-columns: repeat(48, var(--cw));
    gap: var(--cg);
  }
  .cell {
    width: var(--cw);
    height: var(--cw);
    border-radius: 2px;
    background: var(--cx);
    cursor: pointer;
    transition: transform 0.08s ease;
  }
  .cell:hover {
    transform: scale(1.35);
    z-index: 10;
    position: relative;
  }
  .ce { background: var(--ce); }
  .cn { background: var(--cn); }
  .cell.sel {
    outline: 2px solid #38bdf8;
    outline-offset: 1px;
    z-index: 12;
    position: relative;
  }
  .hours {
    margin-top: 2px;
  }
  .hours span {
    font-size: 10px;
    color: var(--mut);
  }

  footer {
    font-size: 12px;
    color: var(--mut);
    margin-top: 14px;
    line-height: 1.7;
  }
  #msg {
    padding: 20px;
    text-align: center;
    color: var(--mut);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    margin-bottom: 14px;
  }

  @media (max-width: 768px) {
    body { padding: 10px; }
    .analytics-container { grid-template-columns: 1fr; }
    .filter-toolbar {
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
    }
    .filter-group {
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      width: 100%;
      min-width: 0;
      max-width: 100%;
    }
    .segmented-control {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      -webkit-overflow-scrolling: touch;
    }
  }

  /* History Log Table */
  .hist-section {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .hist-head {
    font-size: 16px;
    font-weight: 700;
    color: #f8fafc;
    margin-bottom: 4px;
  }
  .hist-desc {
    font-size: 12px;
    color: var(--mut);
    margin-bottom: 12px;
  }
  .hist-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .hist-table th {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    color: var(--mut);
    font-weight: 600;
    font-size: 12px;
    white-space: nowrap;
  }
  .hist-table td {
    padding: 7px 10px;
    border-bottom: 1px solid var(--line-subtle);
    color: var(--txt);
    word-break: break-word;
  }
  .hist-table tr:last-child td {
    border-bottom: none;
  }
  .hist-table tr:hover td {
    background: rgba(255, 255, 255, 0.03);
  }
  .hist-tag-avail {
    display: inline-block;
    background: rgba(16, 185, 129, 0.15);
    color: #34d399;
    border: 1px solid rgba(16, 185, 129, 0.3);
    border-radius: 12px;
    padding: 1px 8px;
    font-size: 11px;
    font-weight: 600;
  }
  .hist-empty {
    text-align: center;
    padding: 20px;
    color: var(--mut);
    font-size: 13px;
  }

  /* Last-known info in cards */
  .last-known {
    margin-top: 6px;
    padding: 6px 8px;
    background: rgba(59, 130, 246, 0.06);
    border: 1px dashed rgba(59, 130, 246, 0.25);
    border-radius: var(--radius-sm);
    font-size: 12px;
    color: #94a3b8;
  }
  .last-known-label {
    color: #60a5fa;
    font-weight: 600;
    font-size: 11px;
    margin-bottom: 2px;
  }
  .last-known-val {
    color: #cbd5e1;
  }

  @media (max-width: 768px) {
    .hist-table { font-size: 12px; }
    .hist-table th, .hist-table td { padding: 6px 6px; }
  }
</style>
</head>
<body>
<header>
  <h1>Cita Previa 4010 <span class="sub" data-i18n="subtitle"></span></h1>
  <div id="meta">…</div>
  <div class="controls">
    <button id="brf" data-i18n="refresh"></button>
    <button data-lang="zh">中文</button>
    <button data-lang="en">EN</button>
    <button data-lang="es">ES</button>
    <a href="https://github.com/aijiesd520/cita_status.github.io" target="_blank" rel="noopener noreferrer" class="gh-link" data-i18n="github_link"></a>
  </div>
</header>

<div id="banner"></div>
<div id="stale"></div>

<!-- Filter controls for city and period selection -->
<div class="filter-toolbar">
  <div class="filter-group">
    <span class="filter-label" data-i18n="filter_city"></span>
    <div class="segmented-control" id="city-pills">
      <button class="pill on" data-city="all" data-i18n="city_all"></button>
      <button class="pill" data-city="28" data-i18n="city_madrid"></button>
      <button class="pill" data-city="46" data-i18n="city_valencia"></button>
    </div>
  </div>
  <div class="filter-group">
    <span class="filter-label" data-i18n="filter_period"></span>
    <div class="segmented-control" id="period-pills">
      <button class="pill on" data-period="current_week" data-i18n="period_current_week"></button>
      <button class="pill" data-period="prev_week" data-i18n="period_prev_week"></button>
      <button class="pill" data-period="last_30_days" data-i18n="period_last_30_days"></button>
    </div>
  </div>
</div>

<!-- Release Pattern Analytics: Golden Slot Card & 24h Distribution Bar Chart -->
<section id="analytics-section" class="analytics-container">
  <div id="golden-card" class="analytics-card golden-card"></div>
  <div id="distribution-card" class="analytics-card chart-card"></div>
</section>

<!-- Real-time KPI Cards Container -->
<main id="cards"></main>

<!-- Heatmap Color Scale Legend -->
<div id="legend">
  <span class="leg-scale">
    <span data-i18n="lg_slots"></span>:
    <span data-i18n="lg_less"></span>
    <span class="sw-grad"></span>
    <span data-i18n="lg_more"></span>
  </span>

function escapeHtml(s) {
  if (s == null) return "";
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")

}

function parseT(s){        // "2026-09-02T08:01:12+0100" -> epoch ms (+HHMM 归一为 +HH:MM)
  if (!s) return NaN;
  return Date.parse(String(s).trim().replace(/([+-]\d\d)(\d\d)$/, "$1:$2"));
}
function zhDT(t_){         // epoch ms -> 无歧义 "09-02 01:04"（马德里墙钟）
  return fmtDayKey.format(t_).slice(5) + " " + fmtHM.format(t_);
}
function rel(ms){
  const m = Math.floor(ms/60000);
  if (m < 1)  return t("just_now");
  if (m < 60) return t("min_ago").replace("{n}", m);
  const h = Math.floor(m/60);
  if (h < 48) return t("hour_ago").replace("{n}", h);
  return t("day_ago").replace("{n}", Math.floor(h/24));
}

function utcKeysBack(n){
  const out = [], now = Date.now();
  for (let i = 0; i <= n; i++){
    const d = new Date(now - i*86400000);
    out.push(d.getUTCFullYear() + String(d.getUTCMonth()+1).padStart(2,"0") + String(d.getUTCDate()).padStart(2,"0"));
  }
  return out;
}

async function fetchDay(key, bust){
  const r = await fetch("d/" + key + ".jsonl" + (bust ? "?t=" + Date.now() : ""));
  if (!r.ok) return;                       // 404 = 该日尚无数据
  const txt = await r.text();
  for (const line of txt.split(/\r?\n/)){
    if (!line.trim()) continue;
    try {
      const d = JSON.parse(line);
      d._t = parseT(d.generated_at);
      if (!isNaN(d._t)) docs.push(d);
    } catch (e) {}
  }
}

/* ---- Period & Date Range Calculations ---- */
function computePeriodDates(periodType, refMs = Date.now()) {
  const refDateStr = fmtDayKey.format(refMs);
  const [y, m, d] = refDateStr.split("-").map(Number);
  const refUtc = new Date(Date.UTC(y, m - 1, d));

  if (periodType === "current_week") {
    // ISO weekday: Monday=0 .. Sunday=6
    const dow = (refUtc.getUTCDay() + 6) % 7;
    const mon = new Date(refUtc.getTime() - dow * 86400000);
    const res = [];
    for (let i = 0; i < 7; i++) {
      res.push(new Date(mon.getTime() + i * 86400000).toISOString().slice(0, 10));
    }
    return res;
  } else if (periodType === "prev_week") {
    const dow = (refUtc.getUTCDay() + 6) % 7;
    const prevMon = new Date(refUtc.getTime() - (dow + 7) * 86400000);
    const res = [];
    for (let i = 0; i < 7; i++) {
      res.push(new Date(prevMon.getTime() + i * 86400000).toISOString().slice(0, 10));
    }
    return res;
  } else if (periodType === "last_30_days") {
    const res = [];
    for (let i = 29; i >= 0; i--) {
      res.push(new Date(refUtc.getTime() - i * 86400000).toISOString().slice(0, 10));
    }
    return res;
  }
  return [];
}

/* ---- Data Loading: Dual-Track Architecture ---- */
async function load(){
  let compactLoaded = false;

  // 1. Primary load: lightweight compact history (< 50KB)
  try {
    const rCompact = await fetch("d/history_compact.json?t=" + Date.now());
    if (rCompact.ok) {
      compactData = await rCompact.json();
      compactLoaded = true;
    }
  } catch (e) {}

  // 2. Fetch today's detailed jsonl snapshot if present
  if (compactLoaded && compactData && compactData.provinces) {
    let latestDateStr = "";
    for (const p of SHOW_PROVINCES) {
      const days = Object.keys((compactData.provinces && compactData.provinces[p]) || {});
      if (days.length) {
        const d = days.sort()[days.length - 1];
        if (d > latestDateStr) latestDateStr = d;
      }
    }
    if (latestDateStr) {
      const dayKey = latestDateStr.replace(/-/g, "");
      try {
        const rJsonl = await fetch("d/" + dayKey + ".jsonl?t=" + Date.now());
        if (rJsonl.ok) {
          const txt = await rJsonl.text();
          docs = [];
          for (const line of txt.split(/\r?\n/)){
            if (!line.trim()) continue;
            try {
              const d = JSON.parse(line);
              d._t = parseT(d.generated_at);
              if (!isNaN(d._t)) docs.push(d);
            } catch (e) {}
          }
        }
      } catch (e) {}
    }
  }

  // 3. Fallback: load recent jsonl files if compactData is missing
  if (!compactLoaded) {
    docs = [];
    let fail = 0;
    const days = utcKeysBack(7);
    await Promise.all(days.map((k, i) =>
      fetchDay(k, i === 0).catch(() => { fail++; })));
  }

  const msg = document.getElementById("msg");
  if (msg) msg.hidden = true;
  const cellinfo = document.getElementById("cellinfo");
  if (cellinfo) cellinfo.style.display = "none";

  const hasData = (compactData && compactData.provinces && Object.keys(compactData.provinces).length > 0) || docs.length > 0;
  if (!hasData){
    const cardsEl = document.getElementById("cards");
    if (cardsEl) cardsEl.innerHTML = "";
    const boardEl = document.getElementById("board");
    if (boardEl) boardEl.innerHTML = "";
    setBanner(null);
    setStale(false);
    if (msg) {
      msg.hidden = false;
      msg.textContent = (typeof location !== "undefined" && location.protocol === "file:")
        ? t("filehint")
        : t("nodata");
    }
    const metaEl = document.getElementById("meta");
    if (metaEl) metaEl.textContent = t("nodata");
    renderAnalytics();
    return;
  }
  render();
}

/* ---- Golden Hours & 24h Distribution Analytics Engine ---- */
function computeGoldenHoursAnalytics(compact, provinceId) {
  const hourly = Array.from({length: 24}, (_, h) => ({ hour: h, checks: 0, hits: 0, rate: 0.0 }));
  const weekdayData = {};
  for (let w = 1; w <= 7; w++) weekdayData[w] = { checks: 0, hits: 0, rate: 0.0 };

  let totalChecks = 0;
  let totalHits = 0;

  if (!compact || !compact.provinces) {
    return {
      hasData: false,
      totalChecks: 0,
      totalHits: 0,
      peakWindow: null,
      hourlyDistribution: hourly,
      weekdayDistribution: weekdayData
    };
  }

  const targetProvs = (provinceId === "all") ? SHOW_PROVINCES : [String(provinceId)];

  for (const pid of targetProvs) {
    const provData = (compact.provinces && compact.provinces[pid]) || {};
    for (const [dayStr, slots] of Object.entries(provData)) {
      let wd = 1;
      try {
        const d = new Date(dayStr + "T12:00:00Z");
        const utcd = d.getUTCDay();
        wd = (utcd === 0) ? 7 : utcd; // ISO: 1=Mon..7=Sun
      } catch (e) {}

      for (const [slotStr, triplet] of Object.entries(slots)) {
        const slotIdx = parseInt(slotStr, 10);
        const h = Math.floor(slotIdx / 2);
        const c = Array.isArray(triplet) ? (triplet[0] || 0) : 0;
        const a = Array.isArray(triplet) ? (triplet[1] || 0) : 0;
        totalChecks += c;
        totalHits += a;

        if (h >= 0 && h < 24) {
          hourly[h].checks += c;
          hourly[h].hits += a;
        }
        if (weekdayData[wd]) {
          weekdayData[wd].checks += c;
          weekdayData[wd].hits += a;
        }
      }
    }
  }

  for (let h = 0; h < 24; h++) {
    if (hourly[h].checks > 0) {
      hourly[h].rate = hourly[h].hits / hourly[h].checks;
    }
  }
  for (let w = 1; w <= 7; w++) {
    if (weekdayData[w].checks > 0) {
      weekdayData[w].rate = weekdayData[w].hits / weekdayData[w].checks;
    }
  }

  if (totalChecks < 10 || totalHits === 0) {
    return {
      hasData: false,
      totalChecks,
      totalHits,
      peakWindow: null,
      hourlyDistribution: hourly,
      weekdayDistribution: weekdayData
    };
  }

  // Find peak hour: max by rate, then hits
  let peakHourEntry = hourly[0];
  for (let h = 1; h < 24; h++) {
    if (hourly[h].rate > peakHourEntry.rate ||
       (hourly[h].rate === peakHourEntry.rate && hourly[h].hits > peakHourEntry.hits)) {
      peakHourEntry = hourly[h];
    }
  }

  // Find peak weekday: max by rate, then hits
  let peakWd = 1;
  let peakWdData = weekdayData[1];
  for (let w = 2; w <= 7; w++) {
    if (weekdayData[w].rate > peakWdData.rate ||
       (weekdayData[w].rate === peakWdData.rate && weekdayData[w].hits > peakWdData.hits)) {
      peakWd = w;
      peakWdData = weekdayData[w];
    }
  }

  let tier = "low";
  if (totalChecks >= 50 && peakHourEntry.hits >= 5) {
    tier = "high";
  } else if (totalChecks >= 20) {
    tier = "medium";
  }

  return {
    hasData: true,
    totalChecks,
    totalHits,
    peakWindow: {
      startHour: peakHourEntry.hour,
      endHour: (peakHourEntry.hour + 1) % 24,
      weekdayIndex: peakWd,
      probability: peakHourEntry.rate,
      confidenceTier: tier
    },
    hourlyDistribution: hourly,
    weekdayDistribution: weekdayData
  };
}

function renderAnalytics() {
  const gCard = document.getElementById("golden-card");
  const cCard = document.getElementById("distribution-card");
  if (!gCard || !cCard) return;

  const stats = computeGoldenHoursAnalytics(compactData, currentCity);

  // 1. Golden Slot Card
  if (!stats.hasData || !stats.peakWindow) {
    gCard.innerHTML = `
      <div class="golden-head">
        <span class="golden-title">${t("golden_title")}</span>
        <span class="golden-badge" style="background:rgba(148,163,184,0.15);color:#94a3b8;border-color:rgba(148,163,184,0.3)">${t("confidence")}: -</span>

        <div class="empty-title">${t("golden_empty_title")}</div>

      </div>
    `;
  } else {
    const pw = stats.peakWindow;
    const startStr = String(pw.startHour).padStart(2, "0") + ":00";
    const endStr = String(pw.endHour).padStart(2, "0") + ":00";
    const wdIdx = pw.weekdayIndex % 7; // 1->1, 7->0
    const wdStr = (lang === "zh" ? "周" : "") + I18N[lang].wd[wdIdx];
    const probPct = (pw.probability * 100).toFixed(1) + "%";
    const confTierKey = "conf_" + pw.confidenceTier;

    gCard.innerHTML = `
      <div class="golden-head">
        <span class="golden-title">${t("golden_title")}</span>
        <span class="golden-badge">${t("best_window")}</span>
      </div>
      <div class="golden-desc">${t("golden_desc")}</div>
      <div class="golden-window">✨ ${wdStr} ${startStr} – ${endStr}</div>
      <div class="golden-stats">
        <div class="stat-pill"><span class="stat-label">${t("prob_index")}:</span><span class="stat-val">${probPct}</span></div>
        <div class="stat-pill"><span class="stat-label">${t("confidence")}:</span><span class="stat-val ${confClass}">${t(confTierKey)}</span></div>
        <div class="stat-pill"><span class="stat-label">${t("slots")}:</span><span class="stat-val">${stats.totalHits}</span></div>
        <div class="stat-pill"><span class="stat-label">${t("checks")}:</span><span class="stat-val">${stats.totalChecks}</span></div>
      </div>
      <div class="golden-tip">💡 ${t("golden_tip")}</div>
    `;
  }

  // 2. 24h Distribution SVG Chart
  if (!stats.hasData) {
    cCard.innerHTML = `
      <div class="chart-head">
        <span class="chart-title">${t("chart_title")}</span>
      </div>
      <div class="chart-subtitle">${t("chart_subtitle")}</div>
      <div class="empty-notice">
        <div class="empty-icon">📊</div>
        <div class="empty-title">${t("chart_empty")}</div>
        <div class="empty-desc">${t("golden_empty_desc")}</div>
      </div>
    `;
  } else {
    const dist = stats.hourlyDistribution;
    let maxRate = 0;
    for (const item of dist) {
      if (item.rate > maxRate) maxRate = item.rate;
    }
    if (maxRate === 0) maxRate = 0.05;

    const chartW = 720;
    const chartH = 150;
    const barW = 20;
    const barGap = 8;
    const offsetX = 24;
    const maxBarH = 95;
    const baseY = 118;

    let barsSvg = "";
    let labelsSvg = "";

    for (let h = 0; h < 24; h++) {
      const item = dist[h];
      const barH = item.checks > 0 ? Math.max(3, (item.rate / maxRate) * maxBarH) : 3;
      const x = offsetX + h * (barW + barGap);
      const y = baseY - barH;
      const isPeak = stats.peakWindow && (h === stats.peakWindow.startHour);
      const fillColor = isPeak ? "#10b981" : (item.hits > 0 ? "#34d399" : "#22304a");
      const strokeColor = isPeak ? "#34d399" : "none";
      const hStr = String(h).padStart(2, "0");
      const tipText = `${hStr}:00–${String((h+1)%24).padStart(2,"0")}:00 | ${t("slots")}: ${item.hits}, ${t("checks")}: ${item.checks} (${(item.rate * 100).toFixed(1)}%)`;

      barsSvg += `<rect class="chart-bar" x="${x}" y="${y}" width="${barW}" height="${barH}" rx="3" fill="${fillColor}" stroke="${strokeColor}" stroke-width="${isPeak ? 1.5 : 0}">
        <title>${tipText}</title>
      </rect>`;

      if (isPeak) {
        barsSvg += `<text x="${x + barW/2}" y="${y - 6}" font-size="10" font-weight="bold" fill="#34d399" text-anchor="middle">🔥</text>`;
      }

      if (h % 3 === 0 || h === 23) {
        labelsSvg += `<text x="${x + barW/2}" y="${baseY + 16}" font-size="10" fill="#94a3b8" text-anchor="middle">${hStr}</text>`;
      }
    }

    cCard.innerHTML = `
      <div class="chart-head">
        <span class="chart-title">${t("chart_title")}</span>
        <span class="golden-badge" style="background:rgba(56,189,248,0.15);color:#38bdf8;border-color:rgba(56,189,248,0.3)">24h</span>
      </div>
      <div class="chart-subtitle">${t("chart_subtitle")}</div>
      <div class="chart-svg-wrap">
        <svg class="chart-svg" viewBox="0 0 ${chartW} ${chartH}" preserveAspectRatio="xMidYMid meet">
          <line x1="${offsetX}" y1="${baseY}" x2="${chartW - 10}" y2="${baseY}" stroke="#22304d" stroke-width="1" />
          ${barsSvg}
          ${labelsSvg}
        </svg>
      </div>
    `;
  }
}

/* ---- Main Render ---- */
function render(){
  docs.sort((a,b) => a._t - b._t);
  const latestDoc = docs.length ? docs[docs.length - 1] : null;

  let updateTime = Date.now();
  if (latestDoc && latestDoc._t) {
    updateTime = latestDoc._t;
  } else if (compactData && compactData.updated_at) {
    const pt = parseT(compactData.updated_at);
    if (!isNaN(pt)) updateTime = pt;
  }

  const metaEl = document.getElementById("meta");
  if (metaEl) {
    metaEl.textContent = t("updated").replace("{t}", zhDT(updateTime)).replace("{r}", rel(Date.now() - updateTime));
  }
  setStale(Date.now() - updateTime > 45*60000);

  // Active appointment banner
  const availNow = (latestDoc && latestDoc.results ? latestDoc.results : [])
    .filter(r => Boolean(r.available || r.kind === "HAS_CITAS") && SHOW_PROVINCES.indexOf(String(r.province)) >= 0);
  setBanner(availNow.length ? availNow : null);

  renderAnalytics();
  renderCards(latestDoc);
  renderBoard();
  renderHistoryLog();
}

  if (!list || !list.length){
    b.style.display = "none";
    b.innerHTML = "";
    return;
  }
  b.style.display = "block";

  b.innerHTML = list.map(r => {
    const badgeText = ` ${t("has_slots")}`;
    let earliestText = "";
    if (r.earliest) {
      let d = "";
      if (typeof r.earliest === "string") {
        d = r.earliest;
      } else if (typeof r.earliest === "object" && r.earliest !== null) {
        d = `${r.earliest.date || ""} ${r.earliest.time || ""}`.trim();
      }
      if (d) earliestText = ` ${t("earliest")}: ${escapeHtml(d)}`;
    }

    const prov = escapeHtml(String(r.province));

  }).join("");
}

function card(r, lastHit){
  const isAvail = Boolean(r.available || r.kind === "HAS_CITAS");

  let cls = "no";
  let ripple = "";
  let st = t("st_no");

  if (isAvail) {
    cls = "ok";
    ripple = `<span class="radar-ripple"></span>`;
    st = t("st_ok");
  } else if (r.status === "error") {
    cls = "err";
    st = t("st_err");
  }

  let det = "";
  if (isAvail) {
    // Earliest compact capsule
    if (r.earliest) {
      let earliestStr = "";
      if (typeof r.earliest === "string") {
        earliestStr = r.earliest;
      } else if (typeof r.earliest === "object" && r.earliest !== null) {
        const d = r.earliest.date || "";
        const tm = r.earliest.time || "";
        earliestStr = (d + " " + tm).trim();
      }
      if (earliestStr) {
        const safeEarliest = escapeHtml(earliestStr);
        det += `<div class="capsule-earliest ok" title="📅 ${t("earliest_badge")}: ${safeEarliest}">📅 ${t("earliest_badge")}: ${safeEarliest}</div>`;
      }
    }

    // Offices lightweight badges with collapsible +N
    let rawOffices = [];
    if (typeof r.offices === "string" && r.offices.trim().length > 0) {
      rawOffices = [r.offices];
    } else if (Array.isArray(r.offices)) {
      rawOffices = r.offices;
    }
    const offices = [];
    const seenOff = new Set();
    for (const raw of rawOffices) {
      const o = (raw == null ? "" : String(raw)).trim();
      if (o && !seenOff.has(o)) {
        seenOff.add(o);
        offices.push(o);
      }
    }

    if (offices.length === 1) {
      const safeOff = escapeHtml(offices[0]);
      det += `<div class="offices-container"><div class="offices-row"><span class="office-tag" title="${safeOff}">🏢 ${safeOff}</span></div></div>`;
    } else if (offices.length > 1) {
      const first = offices[0];
      const rest = offices.slice(1);
      const restCount = rest.length;
      const provStr = String(r.province);
      const isExpanded = expandedOffices.has(provStr);
      const moreText = t("more_offices").replace("{n}", restCount);
      const btnText = isExpanded ? t("collapse_offices") : moreText;
      const displayStyle = isExpanded ? "flex" : "none";
      const ariaExpanded = isExpanded ? "true" : "false";
      const safeFirst = escapeHtml(first);
      const collapseTags = rest.map(o => {
        const safeO = escapeHtml(o);
        return `<span class="office-tag" title="${safeO}">🏢 ${safeO}</span>`;
      }).join("");
      det += `<div class="offices-container">
        <div class="offices-row">
          <span class="office-tag" title="${safeFirst}">🏢 ${safeFirst}</span>
          <button type="button" class="office-btn" data-prov="${escapeHtml(provStr)}" data-count="${restCount}" aria-expanded="${ariaExpanded}" aria-controls="offices-extra-${escapeHtml(provStr)}">${btnText}</button>
        </div>
        <div class="offices-collapse" id="offices-extra-${escapeHtml(provStr)}" style="display:${displayStyle}">${collapseTags}</div>
      </div>`;
    }
  } else if (r.status === "error" && r.error) {
    det += `<div class="err-msg">${escapeHtml((r.error + "").slice(0, 120))}</div>`;
  }

  const tm = parseT(r.checked_at);
  const provName = escapeHtml(r.province_name || r.province);
  const provId = escapeHtml(String(r.province));
  return `<div class="card ${cls}" id="card-${provId}">
    <div class="head"><span class="name">${provName}</span>
    <span class="at">${isNaN(tm) ? "" : zhDT(tm)}</span></div>
    <div class="state">${ripple}${st}</div>
    <div class="det">${det}</div>
    <div class="last">${t("last_hit")}${lastHit ? zhDT(lastHit) + "（" + rel(Date.now()-lastHit) + "）" : t("never")}</div>
  </div>`;
}

function renderCards(latestDoc){
  const lastHits = {};
  for (const d of docs) {
    for (const r of (d.results || [])){
      const isAvail = Boolean(r.available || r.kind === "HAS_CITAS");
      if (!isAvail || !r.province) continue;
      const tm = parseT(r.checked_at) || d._t;
      const pid = String(r.province);
      if (!lastHits[pid] || tm > lastHits[pid]) lastHits[pid] = tm;
    }
  }

  // Fallback metadata for default provinces
  const provMeta = {
    "28": { name: "Madrid", available: false, status: "ok" },
    "46": { name: "Valencia", available: false, status: "ok" }
  };

  const results = (latestDoc && latestDoc.results && latestDoc.results.length)
    ? latestDoc.results
    : SHOW_PROVINCES.map(p => ({
        province: p,
        province_name: provMeta[p].name,
        available: false,
        status: "ok",
        checked_at: new Date().toISOString()
      }));

  const filtered = results.filter(r => {
    if (SHOW_PROVINCES.indexOf(String(r.province)) < 0) return false;
    if (currentCity !== "all" && String(r.province) !== currentCity) return false;
    return true;
  });

  const cardsContainer = document.getElementById("cards");
  if (cardsContainer) {
    cardsContainer.innerHTML = filtered.map(r => card(r, lastHits[String(r.province)])).join("");
  }
}

/* ---- Continuous Green Ramp Interpolation ---- */
const GREEN_RAMP = [
  [155, 233, 168], // #9be9a8 (Stop 0: Less)
  [108, 198, 117], // #6cc675 (Stop 1)
  [64,  196, 99],  // #40c463 (Stop 2)
  [45,  164, 78],  // #2da44e (Stop 3)
  [26,  127, 55],  // #1a7f37 (Stop 4)
  [17,  99,  41]   // #116329 (Stop 5: More)
];
function greenRamp(tVal){
  const cl = Math.max(0, Math.min(1, tVal));
  const pos = cl * (GREEN_RAMP.length - 1);
  const idx = Math.min(Math.floor(pos), GREEN_RAMP.length - 2);
  const frac = pos - idx;
  const [r1, g1, b1] = GREEN_RAMP[idx];
  const [r2, g2, b2] = GREEN_RAMP[idx + 1];
  const r = Math.round(r1 + (r2 - r1) * frac);
  const g = Math.round(g1 + (g2 - g1) * frac);
  const b = Math.round(b1 + (b2 - b1) * frac);
  return `rgb(${r},${g},${b})`;
}

function slotLabel(j){
  const h = Math.floor(j/2), m = (j%2)*30, p = n => String(n).padStart(2,"0");
  return `${p(h)}:${p(m)}–${p(h + (m===30 ? 1 : 0))}:${p(m===30 ? 0 : 30)}`;
}
function rowLabel(key){
  const [,m,d] = key.split("-");
  const wd = I18N[lang].wd[new Date(key + "T12:00:00Z").getUTCDay()];
  return `${m}-${d} ${lang === "zh" ? "周" + wd : wd}`;
}

/* ---- Heatmap Board Rendering with Sticky Date Column ---- */
function renderBoard(){
  const todayKey = fmtDayKey.format(Date.now());
  const days = computePeriodDates(currentPeriod, Date.now());

  // Aggregate cells from compactData or docs
  const provs = new Map();
  const provNames = { "28": "Madrid", "46": "Valencia" };

  const targetProvs = (currentCity === "all") ? SHOW_PROVINCES : [currentCity];

  for (const pid of targetProvs) {
    provs.set(pid, { name: provNames[pid] || ((lang === "zh" ? "省 " : "Prov. ") + pid), cells: new Map() });
  }

  // Populate from compactData if available
  if (compactData && compactData.provinces) {
    for (const pid of targetProvs) {
      const pData = compactData.provinces[pid];
      if (!pData) continue;
      const targetObj = provs.get(pid);
      for (const [dayKey, slots] of Object.entries(pData)) {
        for (const [slotStr, triplet] of Object.entries(slots)) {
          const key = dayKey + "|" + slotStr;
          const c = Array.isArray(triplet) ? (triplet[0] || 0) : 0;
          const a = Array.isArray(triplet) ? (triplet[1] || 0) : 0;
          const e = Array.isArray(triplet) ? (triplet[2] || 0) : 0;
          targetObj.cells.set(key, { c, a, e, offices: [] });
        }
      }
    }
  }

  // Also incorporate any newer in-memory docs
  const seenCheck = new Set();
  for (const doc of docs) {
    for (const r of (doc.results || [])){
      if (!r.province || SHOW_PROVINCES.indexOf(String(r.province)) < 0) continue;
      if (currentCity !== "all" && String(r.province) !== currentCity) continue;
      let tt = parseT(r.checked_at);
      if (isNaN(tt)) tt = doc._t;
      const dk = r.province + "|" + tt;
      if (seenCheck.has(dk)) continue;
      seenCheck.add(dk);

      let o = provs.get(String(r.province));
      if (!o){
        o = { name: r.province_name || provNames[r.province] || ((lang === "zh" ? "省 " : "Prov. ") + r.province), cells: new Map() };
        provs.set(String(r.province), o);
      }
      const hm = fmtHM.format(tt);
      const j = (+hm.slice(0,2))*2 + (+hm.slice(3,5) >= 30 ? 1 : 0);
      const key = fmtDayKey.format(tt) + "|" + j;
      const c = o.cells.get(key) || {c:0, a:0, e:0, offices: []};
      const checks = typeof r.checks_count === "number" ? r.checks_count : 1;
      const isAvail = Boolean(r.available || r.kind === "HAS_CITAS");
      const available = typeof r.available_count === "number" ? r.available_count : (isAvail ? 1 : 0);
      const errors = typeof r.error_count === "number" ? r.error_count : (r.status === "error" ? 1 : 0);

      c.c += checks;
      c.a += available;
      c.e += errors;

      if (r.offices) {
        if (!c.offices) c.offices = [];
        const rawOff = Array.isArray(r.offices) ? r.offices : (typeof r.offices === "string" ? [r.offices] : []);
        for (const off of rawOff) {
          const trimmed = (off == null ? "" : String(off)).trim().replace(/\|/g, "/");
          if (trimmed && !c.offices.includes(trimmed)) c.offices.push(trimmed);
        }
      }

      o.cells.set(key, c);
    }
  }

  const ordered = SHOW_PROVINCES.filter(p => provs.has(p)).map(p => [p, provs.get(p)]);

  // Compute maximum appointment density for relative scaling (0.20 intensity floor)
  let maxDensity = 0;
  for (const [, o] of ordered){
    for (const c of o.cells.values()){
      if (c.a > 0 && c.c > 0){
        const d = c.a / c.c;
        if (d > maxDensity) maxDensity = d;
      }
    }
  }
  const scaleMax = Math.max(maxDensity, 0.20);

  let html = "";
  for (const [, o] of ordered){
    html += `<section class="city"><div class="chead">${o.name}</div>`;
    html += `<div class="heatmap-scroll-wrap"><div class="heatmap-grid">`;
    for (const day of days){
      let cells = "";
      for (let j = 0; j < 48; j++){
        const c = o.cells.get(day + "|" + j) || {c:0, a:0, e:0, offices: []};
        let bgStyle = "";
        let cls = "";
        let cellKind = "NONE";

        if (c.a > 0){
          const d = c.c > 0 ? (c.a / c.c) : 1;
          const rel = Math.min(1, d / scaleMax);
          bgStyle = ` style="background:${greenRamp(rel)}"`;
          cellKind = "REGULAR";
        } else if (c.e >= 6 || (c.c > 0 && (c.e / c.c) >= 0.5)){
          cls = " ce";
          cellKind = "ERROR";
        } else if (c.c > 0){
          cls = " cn";
          cellKind = "EMPTY";
        }

        const lab = `${rowLabel(day)} ${slotLabel(j)} ${o.name}`;
        const pct = c.c > 0 ? ` (${Math.round((c.a / c.c) * 100)}%)` : "";
        let cnt = `${t("checks")} ${c.c} · ${t("slots")} ${c.a}${pct}`;
        cnt += ` · ${t("errors")} ${c.e}`;
        if (c.offices && c.offices.length) {
          cnt += ` · ${t("offices_title")}: ${c.offices.join(" · ")}`;
        }

        const officesAttr = (c.offices && c.offices.length) ? escapeHtml(c.offices.join(" · ")) : "";
        cells += `<span class="cell${cls}"${bgStyle} data-lab="${escapeHtml(lab)}" data-cnt="${escapeHtml(cnt)}" data-t="${escapeHtml(lab)}|${escapeHtml(cnt)}|${c.c}|${c.a}|${c.e}|${escapeHtml(slotLabel(j))}|${escapeHtml(day)}|${c.a}|0" data-regular="${c.a}" data-available="${c.a}" data-kind="${cellKind}" data-offices="${officesAttr}" title="${escapeHtml(lab)}&#10;${escapeHtml(cnt)}"></span>`;
      }
      html += `<div class="row${day===todayKey ? " today" : ""}"><span class="rlabel sticky-col">${rowLabel(day)}</span><div class="cells">${cells}</div></div>`;
    }
    // Bottom hour marks: 00 / 06 / 12 / 18 / 24
    html += `<div class="row"><span class="rlabel sticky-col"></span><div class="cells hours">` +
      [0,12,24,36].map(j => `<span style="grid-column:${j+1}">${String(j/2).padStart(2,"0")}</span>`).join("") +
      `<span style="grid-column:48; justify-self:end">24</span>` +
      `</div></div>`;
    html += `</div></div></section>`;
  }

  const boardEl = document.getElementById("board");
  if (boardEl) boardEl.innerHTML = html;
}

const brfEl = document.getElementById("brf");

const boardEl = document.getElementById("board");
if (boardEl) {
  function formatCellInfo(cell) {
    const dataParts = (cell.getAttribute("data-t") || "").split("|");
    const tm = cell.getAttribute("data-lab") || dataParts[0] || "";
    let cnt = cell.getAttribute("data-cnt");
    if (!cnt && dataParts.length > 1) {
      if (dataParts.length >= 9) {
        cnt = dataParts.slice(1, -7).join("|");
      } else if (dataParts.length >= 7) {
        cnt = dataParts.slice(1, -5).join("|");
      } else {
        cnt = dataParts.slice(1).join("|");
      }
    }
    return { tm, cnt: cnt || "" };
  }

  boardEl.addEventListener("click", e => {
    const cell = e.target.closest(".cell");
    const info = document.getElementById("cellinfo");
    if (!info) return;
    if (!cell){ info.style.display = "none"; return; }
    document.querySelectorAll(".cell.sel").forEach(x => x.classList.remove("sel"));
    cell.classList.add("sel");
    const { tm, cnt } = formatCellInfo(cell);
    info.textContent = "📌 " + tm + " —— " + cnt;
    info.style.display = "block";
  });

  // Fast hover inspect tooltip (<50ms)
  boardEl.addEventListener("mouseover", e => {
    const cell = e.target.closest(".cell");
    if (!cell) return;
    const info = document.getElementById("cellinfo");
    if (!info) return;
    const { tm, cnt } = formatCellInfo(cell);
    if (tm || cnt) {
      info.textContent = "📌 " + tm + " —— " + cnt;
      info.style.display = "block";
    }
  });
}

// City selector pills handler
const cityPillsContainer = document.getElementById("city-pills");
if (cityPillsContainer) {
  cityPillsContainer.addEventListener("click", e => {
    const pill = e.target.closest(".pill");
    if (!pill || !pill.dataset.city) return;
    currentCity = pill.dataset.city;
    document.querySelectorAll("#city-pills .pill").forEach(p => p.classList.toggle("on", p === pill));
    document.querySelectorAll(".cell.sel").forEach(x => x.classList.remove("sel"));
    const cellinfo = document.getElementById("cellinfo");
    if (cellinfo) cellinfo.style.display = "none";
    renderCards(docs.length ? docs[docs.length - 1] : null);
    renderBoard();
    renderAnalytics();
  });
}

// Period selector pills handler
const periodPillsContainer = document.getElementById("period-pills");
if (periodPillsContainer) {
  periodPillsContainer.addEventListener("click", e => {
    const pill = e.target.closest(".pill");
    if (!pill || !pill.dataset.period) return;
    currentPeriod = pill.dataset.period;
    document.querySelectorAll("#period-pills .pill").forEach(p => p.classList.toggle("on", p === pill));
    document.querySelectorAll(".cell.sel").forEach(x => x.classList.remove("sel"));
    const cellinfo = document.getElementById("cellinfo");
    if (cellinfo) cellinfo.style.display = "none";
    renderBoard();
  });
}

// Language buttons handler
document.querySelectorAll("[data-lang]").forEach(b => {
  b.onclick = () => {
    lang = b.dataset.lang;
    safeSetStorage("lang", lang);
    document.querySelectorAll(".cell.sel").forEach(x => x.classList.remove("sel"));
    const cellinfo = document.getElementById("cellinfo");
    if (cellinfo) cellinfo.style.display = "none";
    applyStatic();
    const hasData = (compactData && compactData.provinces && Object.keys(compactData.provinces).length > 0) || docs.length > 0;
    if (hasData) render();
    else load();
  };
});

// Office toggle button handler
const cardsContainerEl = document.getElementById("cards");
if (cardsContainerEl) {
  cardsContainerEl.addEventListener("click", e => {
    const btn = e.target.closest(".office-btn");
    if (!btn) return;
    e.stopPropagation();
    const prov = String(btn.dataset.prov);
    const extra = document.getElementById("offices-extra-" + prov);
    if (!extra) return;
    const isHidden = extra.style.display === "none" || !extra.style.display;
    if (isHidden) {
      extra.style.display = "flex";
      btn.setAttribute("aria-expanded", "true");
      btn.textContent = t("collapse_offices");
      expandedOffices.add(prov);
    } else {
      extra.style.display = "none";
      btn.setAttribute("aria-expanded", "false");
      const count = btn.dataset.count;
      btn.textContent = t("more_offices").replace("{n}", count);
      expandedOffices.delete(prov);
    }
  });
}

if (typeof window !== "undefined") {
  window._cita = { render, renderCards, renderBoard, card, computeGoldenHoursAnalytics, I18N, t, SHOW_PROVINCES, expandedOffices, escapeHtml, setBanner };
}

setInterval(load, 60000);
applyStatic();
load();
</script>
</body>
</html>
