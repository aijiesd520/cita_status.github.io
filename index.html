<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cita Previa 4010 放号监控</title>
<style>
  :root {
    --bg: #0b0f19;
    --bg-subtle: #111827;
    --card: #151e32;
    --card-hover: #1c2742;
    --line: #22304d;
    --line-subtle: #1a253c;
    --txt: #f1f5f9;
    --mut: #94a3b8;
    --accent: #10b981;
    --accent-glow: rgba(16, 185, 129, 0.25);
    --cw: 12px;
    --cg: 2px;
    --lw: 96px;
    --g1: #9be9a8; --g2: #6cc675; --g3: #40c463; --g4: #2da44e; --g5: #1a7f37; --g6: #116329;
    --ce: #ef4444; --cn: #22304a; --cx: #141c2c;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
    --safe-area-inset-top: env(safe-area-inset-top, 0px);
  }

  @media (max-width: 768px) {
    :root {
      --cw: 14px;
      --cg: 2.5px;
      --lw: 80px;
    }

    .cell {
      position: relative;
      touch-action: pan-x pan-y;
    }
    .cell::before {
      content: "";
      position: absolute;
      top: -5px;
      bottom: -5px;
      left: -3px;
      right: -3px;
    }
    .cell:hover, .cell:focus-visible {
      transform: none;
    }
  }

  * { box-sizing: border-box; }
  html, body {
    max-width: 100%;
    overflow-x: hidden;
  }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--txt);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  header {
    margin-bottom: 8px;
  }
  h1 {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -0.3px;
    color: #f8fafc;
  }
  .sub {
    font-size: 13px;
    color: var(--mut);
    font-weight: 400;
    margin-left: 6px;
  }
  #meta {
    font-size: 13px;
    color: var(--mut);
    margin: 2px 0 8px;
  }

  /* Control buttons & header links */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 8px;
    align-items: center;
  }
  button, .gh-link {
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: var(--radius-sm);
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
    color: var(--txt);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    transition: all 0.15s ease;
  }
  button:hover, .gh-link:hover {
    background: var(--card-hover);
    border-color: #3b82f6;
  }
  button.on {
    background: #2563eb;
    color: #fff;
    border-color: #2563eb;
  }

  /* Active appointment glowing banner */
  @keyframes pulse-glow {
    0%, 100% {
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.4), inset 0 0 8px rgba(16, 185, 129, 0.2);
      border-color: rgba(16, 185, 129, 0.8);
    }
    50% {
      box-shadow: 0 0 32px rgba(16, 185, 129, 0.8), inset 0 0 16px rgba(16, 185, 129, 0.4);
      border-color: #10b981;
    }
  }
  #banner {
    display: none;
    background: linear-gradient(135deg, #065f46 0%, #047857 100%);
    color: #fff;
    border: 1px solid #10b981;
    border-radius: var(--radius-md);
    padding: 12px 18px;
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 14px;
    animation: pulse-glow 2.5s infinite ease-in-out;
    word-break: break-word;
    overflow-wrap: anywhere;
  }
  #banner a {
    color: #fff;
    text-decoration: underline;
    margin-right: 14px;
    transition: opacity 0.2s;
  }
  #banner a:hover {
    opacity: 0.85;
  }

  #stale {
    display: none;
    background: rgba(245, 158, 11, 0.12);
    color: #fbbf24;
    border: 1px solid #d97706;
    border-radius: var(--radius-md);
    padding: 10px 14px;
    font-size: 13px;
    margin-bottom: 14px;
  }

  /* Filters toolbar */
  .filter-toolbar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 8px 12px;
    margin-bottom: 8px;
    box-shadow: var(--shadow);
  }
  .filter-group {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    max-width: 100%;
  }
  .filter-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--mut);
    white-space: nowrap;
  }
  .segmented-control {
    display: inline-flex;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 2px;
    gap: 4px;
    min-width: 0;
    max-width: 100%;
    flex-wrap: wrap;
  }
  .pill {
    border: none;
    background: transparent;
    color: var(--mut);
    border-radius: 4px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .pill:hover {
    color: var(--txt);
    background: rgba(255, 255, 255, 0.05);
  }
  .pill.on {
    background: #2563eb;
    color: #fff;
    font-weight: 600;
  }

  /* Analytics section */
  .analytics-container {
    display: grid;
    grid-template-columns: 0.95fr 1.05fr 1.3fr;
    gap: 10px;
    margin-bottom: 8px;
  }
  .analytics-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 12px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .golden-card {
    border-left: 4px solid var(--accent);
  }
  .golden-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }
  .golden-title {
    font-size: 14px;
    font-weight: 700;
    color: #f8fafc;
  }
  .golden-badge {
    background: rgba(16, 185, 129, 0.15);
    color: #34d399;
    border: 1px solid rgba(16, 185, 129, 0.3);
    padding: 2px 7px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
  }
  .golden-desc {
    font-size: 11.5px;
    color: var(--mut);
    margin-bottom: 4px;
  }
  .golden-window {
    font-size: 19px;
    font-weight: 800;
    color: #f8fafc;
    margin: 2px 0 6px;
    letter-spacing: -0.5px;
  }
  .golden-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 6px;
  }
  .stat-pill {
    background: var(--bg-subtle);
    border: 1px solid var(--line-subtle);
    padding: 3px 6px;
    border-radius: var(--radius-sm);
    font-size: 11.5px;
  }
  .stat-label {
    color: var(--mut);
    margin-right: 4px;
  }
  .stat-val {
    font-weight: 700;
    color: #f1f5f9;
  }
  .conf-tier-high { color: #34d399; }
  .conf-tier-medium { color: #fbbf24; }
  .conf-tier-low { color: #94a3b8; }
  .golden-tip {
    margin-top: auto;
    font-size: 11px;
    color: var(--mut);
    background: rgba(255, 255, 255, 0.02);
    border-top: 1px dashed var(--line);
    padding-top: 6px;
  }

  .chart-card {
    border-left: 4px solid #38bdf8;
  }
  .chart-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }
  .chart-title {
    font-size: 14px;
    font-weight: 700;
    color: #f8fafc;
  }
  .chart-subtitle {
    font-size: 11.5px;
    color: var(--mut);
    margin-bottom: 4px;
  }
  .chart-svg-wrap {
    width: 100%;
    margin-top: auto;
  }
  .chart-svg {
    width: 100%;
    height: auto;
    display: block;
    overflow: visible;
  }
  .chart-bar {
    transition: opacity 0.15s ease, stroke-width 0.15s ease;
    cursor: pointer;
  }
  .chart-bar:hover {
    opacity: 0.85;
  }
  .chart-bar.chart-bar-active,
  .weekly-bar.weekly-bar-active {
    stroke: #38bdf8 !important;
    stroke-width: 2px !important;
    opacity: 1 !important;
  }

  /* Weekly Distribution Component */
  .weekly-card {
    border-left: 4px solid #8b5cf6;
  }
  .weekly-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 2px;
  }
  .weekly-title-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .weekly-title {
    font-size: 14px;
    font-weight: 700;
    color: #f8fafc;
  }
  .weekly-badge {
    background: rgba(139, 92, 246, 0.15);
    color: #a78bfa;
    border: 1px solid rgba(139, 92, 246, 0.35);
  }
  .weekly-best-highlight {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
  }
  .weekly-best-pill {
    background: rgba(139, 92, 246, 0.15);
    border: 1px solid rgba(139, 92, 246, 0.35);
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 11.5px;
    color: #f8fafc;
    font-weight: 600;
  }
  .weekly-best-pill strong {
    color: #c084fc;
    margin-left: 3px;
  }
  .weekly-body {
    display: grid;
    grid-template-columns: 180px 1fr;
    gap: 10px;
    align-items: center;
    margin-top: 4px;
  }
  @media (max-width: 1023px) and (min-width: 769px) {
    .analytics-container {
      grid-template-columns: 1fr 1fr;
    }
    .weekly-card {
      grid-column: 1 / -1;
    }
    .weekly-body {
      grid-template-columns: 1fr 1.15fr;
      gap: 14px;
    }
  }
  .weekly-chart-col {
    width: 100%;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  .weekly-chart-wrap {
    width: 100%;
    min-width: 0;
  }
  .weekly-svg {
    width: 100%;
    height: auto;
    display: block;
    overflow: visible;
  }
  .weekly-table-col {
    width: 100%;
    min-width: 0;
  }
  .weekly-table-wrap {
    width: 100%;
    min-width: 0;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: rgba(11, 15, 25, 0.4);
  }
  .weekly-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11.5px;
    line-height: 1.35;
  }
  .weekly-table th {
    text-align: left;
    padding: 4px 6px;
    border-bottom: 1px solid var(--line);
    color: var(--mut);
    font-weight: 600;
    font-size: 11px;
    white-space: nowrap;
    background: rgba(21, 30, 50, 0.5);
  }
  .weekly-table td {
    padding: 3px 6px;
    border-bottom: 1px solid var(--line-subtle);
    color: var(--txt);
    white-space: nowrap;
  }
  .weekly-table tr:last-child td {
    border-bottom: none;
  }
  .weekly-table tr {
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .weekly-table tr:hover td,
  .weekly-table tr.table-row-hover td {
    background: rgba(139, 92, 246, 0.18) !important;
  }
  .weekly-table tr.peak-weekday-row td {
    background: rgba(16, 185, 129, 0.12);
  }
  .weekly-table tr.peak-weekday-row td:first-child {
    border-left: 3px solid #10b981;
  }
  .weekly-best-tag {
    display: inline-block;
    background: rgba(16, 185, 129, 0.2);
    color: #34d399;
    border: 1px solid rgba(16, 185, 129, 0.4);
    border-radius: 10px;
    padding: 1px 5px;
    font-size: 9.5px;
    font-weight: 700;
    margin-left: 4px;
    vertical-align: middle;
  }
  .peak-rate {
    color: #34d399;
    font-weight: 700;
  }

  .empty-notice {
    padding: 24px 16px;
    text-align: center;
    color: var(--mut);
    margin: auto 0;
  }
  .empty-icon {
    font-size: 26px;
    margin-bottom: 4px;
  }
  .empty-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--txt);
    margin-bottom: 2px;
  }
  .empty-desc {
    font-size: 12px;
    color: var(--mut);
  }

  /* Real-time KPI Cards */
  #cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 10px;
    margin-bottom: 8px;
  }
  .card {
    min-height: 240px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 12px 14px;
    box-shadow: var(--shadow);
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .card:hover {
    transform: translateY(-2px);
    border-color: #3b82f6;
  }
  .card.ok {
    border-color: var(--accent);
    background: linear-gradient(180deg, rgba(16, 185, 129, 0.08) 0%, var(--card) 100%);
    box-shadow: 0 4px 20px rgba(16, 185, 129, 0.15);
  }
  .card.err {
    border-color: var(--ce);
  }
  .card .head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .card .name {
    font-size: 16px;
    font-weight: 700;
    color: #f8fafc;
  }
  .card .at {
    font-size: 12px;
    color: var(--mut);
  }
  .card .state {
    font-size: 17px;
    font-weight: 700;
    margin: 8px 0 4px;
    color: var(--mut);
  }
  .card.ok .state { color: #34d399; }
  .card.err .state { color: #f87171; }
  .card .det {
    font-size: 13px;
    line-height: 1.5;
    color: #cbd5e1;
  }
  .capsule-earliest {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 3px 8px;
    font-size: 12px;
    font-weight: 600;
    color: #f1f5f9;
    margin: 4px 0 6px;
    max-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .capsule-earliest.ok {
    background: rgba(16, 185, 129, 0.12);
    border-color: rgba(16, 185, 129, 0.35);
    color: #34d399;
  }
  .offices-container {
    margin-top: 4px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-width: 100%;
  }
  .offices-row {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    align-items: center;
    max-width: 100%;
  }
  .office-tag {
    display: inline-flex;
    align-items: center;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 2px 7px;
    font-size: 11px;
    color: #cbd5e1;
    max-width: 100%;
    word-break: break-word;
    overflow-wrap: anywhere;
  }
  .office-btn {
    display: inline-flex;
    align-items: center;
    background: rgba(59, 130, 246, 0.12);
    border: 1px solid rgba(59, 130, 246, 0.3);
    color: #60a5fa;
    border-radius: var(--radius-sm);
    padding: 2px 7px;
    font-size: 11px;
    cursor: pointer;
    line-height: 1.4;
    transition: all 0.15s ease;
  }
  .office-btn:hover {
    background: rgba(59, 130, 246, 0.22);
    color: #93c5fd;
  }
  .offices-collapse {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 2px;
    max-width: 100%;
  }
  .card .last {
    font-size: 12px;
    color: var(--mut);
    margin-top: 8px;
    border-top: 1px dashed var(--line);
    padding-top: 8px;
  }

  @keyframes radar-ripple {
    0% {
      transform: scale(0.9);
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
    }
    70% {
      transform: scale(1.1);
      box-shadow: 0 0 0 8px rgba(16, 185, 129, 0);
    }
    100% {
      transform: scale(0.9);
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
    }
  }
  .radar-ripple {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #10b981;
    margin-right: 6px;
    vertical-align: middle;
    animation: radar-ripple 1.8s infinite ease-out;
  }

  /* Legend */
  #legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    font-size: 12px;
    color: var(--mut);
    margin: 0 0 8px;
    align-items: center;
  }
  .leg-scale {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .sw-grad {
    display: inline-block;
    width: 64px;
    height: 11px;
    border-radius: 2px;
    margin: 0 4px;
    vertical-align: -1px;
    background: linear-gradient(to right, var(--g1), var(--g2), var(--g3), var(--g4), var(--g5), var(--g6));
  }
  .sw {
    display: inline-block;
    width: 11px;
    height: 11px;
    border-radius: 2px;
    margin-right: 4px;
    vertical-align: -1px;
    background: var(--cx);
  }

  /* Interactive Tooltip & Popover */
  #cellinfo-zone {
    display: contents;
  }

  #cellinfo {
    display: none;
    background: #1e293b;
    color: #f8fafc;
    border: 1px solid #334155;
    border-radius: var(--radius-md);
    padding: 10px 14px;
    font-size: 13px;
    margin-bottom: 12px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    word-break: break-word;
    overflow-wrap: anywhere;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  #cellinfo.is-placeholder {
    background: rgba(21, 30, 50, 0.65);
    border-color: #22304d;
    cursor: default;
  }

  .cellinfo-placeholder {
    display: flex;
    align-items: center;
    gap: 12px;
    height: 100%;
    color: var(--mut);
    user-select: none;
  }

  .cellinfo-placeholder-icon {
    font-size: 20px;
    line-height: 1;
    opacity: 0.8;
    flex-shrink: 0;
  }

  .cellinfo-placeholder-body {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .cellinfo-placeholder-title {
    font-size: 13px;
    font-weight: 600;
    color: #cbd5e1;
    letter-spacing: 0.01em;
  }

  .cellinfo-placeholder-desc {
    font-size: 11.5px;
    color: #64748b;
    line-height: 1.4;
  }

  @media (min-width: 769px) {
    #cellinfo-zone {
      display: block;
      height: 112px;
      min-height: 112px;
      max-height: 112px;
      margin-bottom: 12px;
      box-sizing: border-box;
      contain: layout paint;
    }
    #cellinfo {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 100%;
      max-height: 100%;
      margin-bottom: 0;
      box-sizing: border-box;
      overflow-y: auto;
      overflow-x: hidden;
    }
    #cellinfo::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    #cellinfo::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    #cellinfo::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  }

  @media (max-width: 768px) {
    #cellinfo-zone {
      display: contents;
      height: 0;
      min-height: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }
    #cellinfo {
      position: fixed;
      bottom: 12px;
      bottom: max(12px, env(safe-area-inset-bottom, 12px), var(--safe-area-inset-bottom, 0px));
      left: 12px;
      right: 12px;
      max-width: 520px;
      height: auto;
      min-height: 0;
      max-height: 480px;
      max-height: calc(100vh - 48px);
      max-height: min(480px, calc(100vh - 48px));
      max-height: min(480px, calc(100vh - max(12px, env(safe-area-inset-bottom, 12px), var(--safe-area-inset-bottom, 0px)) - max(16px, env(safe-area-inset-top, 16px), var(--safe-area-inset-top, 0px))));
      max-height: min(480px, calc(100dvh - max(12px, env(safe-area-inset-bottom, 12px), var(--safe-area-inset-bottom, 0px)) - max(16px, env(safe-area-inset-top, 16px), var(--safe-area-inset-top, 0px))));
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      margin: 0 auto;
      z-index: 1000;
      border: 1px solid #3b82f6;

function escapeHtml(s) {

  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")

}

function getWeekdayLabel(isoWeekday, langCode = lang, full = false) {

      short: ["周一", "周二", "周三", "周四", "周五", "周六", "周日"],
      full: ["星期一", "星期二", "星期三", "星期四", "星期五", "星期六", "星期日"]
    },
    en: {
      short: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"],
      full: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"]
    },
    es: {
      short: ["lun", "mar", "mié", "jue", "vie", "sáb", "dom"],
      full: ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"]

  };
  const curLang = (langCode && labels[langCode]) ? langCode : "en";

  return arr[idx];
}

function parseT(s){        // "2026-09-02T08:01:12+0100" -> epoch ms (+HHMM 归一为 +HH:MM)
  if (!s) return NaN;
  return Date.parse(String(s).trim().replace(/([+-]\d\d)(\d\d)$/, "$1:$2"));
}
function zhDT(t_){         // epoch ms -> 无歧义 "09-02 01:04"（马德里墙钟）
  return fmtDayKey.format(t_).slice(5) + " " + fmtHM.format(t_);
}
function rel(ms){
  const m = Math.floor(ms/60000);
  if (m < 1)  return t("just_now");
  if (m < 60) return t("min_ago").replace("{n}", m);
  const h = Math.floor(m/60);
  if (h < 48) return t("hour_ago").replace("{n}", h);
  return t("day_ago").replace("{n}", Math.floor(h/24));
}

function utcKeysBack(n){
  const out = [], now = Date.now();
  for (let i = 0; i <= n; i++){
    const d = new Date(now - i*86400000);
    out.push(d.getUTCFullYear() + String(d.getUTCMonth()+1).padStart(2,"0") + String(d.getUTCDate()).padStart(2,"0"));
  }
  return out;
}

async function fetchDay(key, bust){
  const r = await fetch("d/" + key + ".jsonl" + (bust ? "?t=" + Date.now() : ""));
  if (!r.ok) return;                       // 404 = 该日尚无数据
  const txt = await r.text();
  for (const line of txt.split(/\r?\n/)){
    if (!line.trim()) continue;
    try {
      const d = JSON.parse(line);
      d._t = parseT(d.generated_at);
      if (!isNaN(d._t)) docs.push(d);
    } catch (e) {}
  }
}

/* ---- Period & Date Range Calculations ---- */
function computePeriodDates(periodType, refMs = Date.now()) {
  const refDateStr = fmtDayKey.format(refMs);
  const [y, m, d] = refDateStr.split("-").map(Number);
  const refUtc = new Date(Date.UTC(y, m - 1, d));

  if (periodType === "current_week") {
    // ISO weekday: Monday=0 .. Sunday=6
    const dow = (refUtc.getUTCDay() + 6) % 7;
    const mon = new Date(refUtc.getTime() - dow * 86400000);
    const res = [];
    for (let i = 0; i < 7; i++) {
      res.push(new Date(mon.getTime() + i * 86400000).toISOString().slice(0, 10));
    }
    return res;
  } else if (periodType === "prev_week") {
    const dow = (refUtc.getUTCDay() + 6) % 7;
    const prevMon = new Date(refUtc.getTime() - (dow + 7) * 86400000);
    const res = [];
    for (let i = 0; i < 7; i++) {
      res.push(new Date(prevMon.getTime() + i * 86400000).toISOString().slice(0, 10));
    }
    return res;
  } else if (periodType === "last_30_days") {
    const res = [];
    for (let i = 29; i >= 0; i--) {
      res.push(new Date(refUtc.getTime() - i * 86400000).toISOString().slice(0, 10));
    }
    return res;
  }
  return [];
}

/* ---- Data Loading: Dual-Track Architecture ---- */
async function load(){
  let compactLoaded = false;

  // 1. Primary load: lightweight compact history (< 50KB)
  try {
    const rCompact = await fetch("d/history_compact.json?t=" + Date.now());
    if (rCompact.ok) {
      compactData = await rCompact.json();
      compactLoaded = true;
    }
  } catch (e) {}

  // 2. Fetch today's detailed jsonl snapshot if present
  if (compactLoaded && compactData && compactData.provinces) {
    let latestDateStr = "";
    for (const p of SHOW_PROVINCES) {
      const days = Object.keys((compactData.provinces && compactData.provinces[p]) || {});
      if (days.length) {
        const d = days.sort()[days.length - 1];
        if (d > latestDateStr) latestDateStr = d;
      }
    }
    if (latestDateStr) {
      const dayKey = latestDateStr.replace(/-/g, "");
      try {
        const rJsonl = await fetch("d/" + dayKey + ".jsonl?t=" + Date.now());
        if (rJsonl.ok) {
          const txt = await rJsonl.text();
          docs = [];
          for (const line of txt.split(/\r?\n/)){
            if (!line.trim()) continue;
            try {
              const d = JSON.parse(line);
              d._t = parseT(d.generated_at);
              if (!isNaN(d._t)) docs.push(d);
            } catch (e) {}
          }
        }
      } catch (e) {}
    }
  }

  // 3. Fallback: load recent jsonl files if compactData is missing
  if (!compactLoaded) {
    docs = [];
    let fail = 0;
    const days = utcKeysBack(7);
    await Promise.all(days.map((k, i) =>
      fetchDay(k, i === 0).catch(() => { fail++; })));
  }

  const msg = document.getElementById("msg");
  if (msg) msg.hidden = true;
  dismissCellInfo();

  const hasData = (compactData && compactData.provinces && Object.keys(compactData.provinces).length > 0) || docs.length > 0;
  if (!hasData){
    const cardsEl = document.getElementById("cards");
    if (cardsEl) cardsEl.innerHTML = "";
    const boardEl = document.getElementById("board");
    if (boardEl) boardEl.innerHTML = "";
    setBanner(null);
    setStale(false);
    if (msg) {
      msg.hidden = false;
      msg.textContent = (typeof location !== "undefined" && location.protocol === "file:")
        ? t("filehint")
        : t("nodata");
    }
    const metaEl = document.getElementById("meta");
    if (metaEl) metaEl.textContent = t("nodata");
    renderAnalytics();
    return;
  }
  render();
}

/* ---- Golden Hours & 24h / Weekly Distribution Analytics Engine ---- */
function computeGoldenHoursAnalytics(compact, provinceId, period = null, refMs = Date.now()) {
  const hourly = Array.from({length: 24}, (_, h) => ({ hour: h, checks: 0, hits: 0, rate: 0.0 }));
  const weekdayData = {};
  for (let w = 1; w <= 7; w++) weekdayData[w] = { checks: 0, hits: 0, rate: 0.0 };

  let totalChecks = 0;
  let totalHits = 0;

  if (!compact || !compact.provinces) {
    return {
      hasData: false,
      totalChecks: 0,
      totalHits: 0,
      peakWindow: null,
      bestWeekday: null,
      hourlyDistribution: hourly,
      weekdayDistribution: weekdayData
    };
  }

  let allowedDates = null;
  if (period && period !== "all" && period !== "all_time") {
    if (period instanceof Set) {
      allowedDates = period;
    } else if (Array.isArray(period)) {
      allowedDates = new Set(period);
    } else if (typeof period === "string") {
      const dates = computePeriodDates(period, refMs);
      if (dates && dates.length > 0) {
        allowedDates = new Set(dates);
      }
    }
  }

  const targetProvs = (provinceId === "all") ? SHOW_PROVINCES : [String(provinceId)];

  for (const pid of targetProvs) {
    const provData = (compact.provinces && compact.provinces[pid]) || {};
    for (const [dayStr, slots] of Object.entries(provData)) {
      if (allowedDates && !allowedDates.has(dayStr)) {
        continue;
      }

      let wd = 1;
      try {
        const d = new Date(dayStr + "T12:00:00Z");
        const utcd = d.getUTCDay();
        wd = (utcd === 0) ? 7 : utcd; // ISO: 1=Mon..7=Sun
      } catch (e) {}

      for (const [slotStr, triplet] of Object.entries(slots)) {
        const slotIdx = parseInt(slotStr, 10);
        const h = Math.floor(slotIdx / 2);
        const c = Array.isArray(triplet) ? (triplet[0] || 0) : 0;
        const a = Array.isArray(triplet) ? (triplet[1] || 0) : 0;
        totalChecks += c;
        totalHits += a;

        if (h >= 0 && h < 24) {
          hourly[h].checks += c;
          hourly[h].hits += a;
        }
        if (weekdayData[wd]) {
          weekdayData[wd].checks += c;
          weekdayData[wd].hits += a;
        }
      }
    }
  }

  for (let h = 0; h < 24; h++) {
    if (hourly[h].checks > 0) {
      hourly[h].rate = hourly[h].hits / hourly[h].checks;
    }
  }
  for (let w = 1; w <= 7; w++) {
    if (weekdayData[w].checks > 0) {
      weekdayData[w].rate = weekdayData[w].hits / weekdayData[w].checks;
    }
  }

  if (totalChecks < 10 || totalHits === 0) {
    return {
      hasData: false,
      totalChecks,
      totalHits,
      peakWindow: null,
      bestWeekday: null,
      hourlyDistribution: hourly,
      weekdayDistribution: weekdayData
    };
  }

  // Find peak hour: max by rate, then hits
  let peakHourEntry = hourly[0];
  for (let h = 1; h < 24; h++) {
    if (hourly[h].rate > peakHourEntry.rate ||
       (hourly[h].rate === peakHourEntry.rate && hourly[h].hits > peakHourEntry.hits)) {
      peakHourEntry = hourly[h];
    }
  }

  // Find peak weekday: max by rate, then hits
  let peakWd = 1;
  let peakWdData = weekdayData[1];
  for (let w = 2; w <= 7; w++) {
    if (weekdayData[w].rate > peakWdData.rate ||
       (weekdayData[w].rate === peakWdData.rate && weekdayData[w].hits > peakWdData.hits)) {
      peakWd = w;
      peakWdData = weekdayData[w];
    }
  }

  let tier = "low";
  if (totalChecks >= 50 && peakHourEntry.hits >= 5) {
    tier = "high";
  } else if (totalChecks >= 20) {
    tier = "medium";
  }

  let wdTier = "low";
  if (totalChecks >= 50 && peakWdData.hits >= 5) {
    wdTier = "high";
  } else if (totalChecks >= 20 && peakWdData.hits >= 2) {
    wdTier = "medium";
  }

  return {
    hasData: true,
    totalChecks,
    totalHits,
    peakWindow: {
      startHour: peakHourEntry.hour,
      endHour: (peakHourEntry.hour + 1) % 24,
      weekdayIndex: peakWd,
      probability: peakHourEntry.rate,
      confidenceTier: tier
    },
    bestWeekday: {
      weekdayIndex: peakWd,
      checks: peakWdData.checks,
      hits: peakWdData.hits,
      rate: peakWdData.rate,
      confidenceTier: wdTier
    },
    hourlyDistribution: hourly,
    weekdayDistribution: weekdayData
  };
}

        <span class="golden-badge">${t("best_window")}</span>
      </div>

      <div class="golden-window">✨ ${wdStr} ${startStr} – ${endStr}</div>
      <div class="golden-stats">
        <div class="stat-pill"><span class="stat-label">${t("prob_index")}:</span><span class="stat-val">${probPct}</span></div>
        <div class="stat-pill"><span class="stat-label">${t("confidence")}:</span><span class="stat-val ${confClass}">${t(confTierKey)}</span></div>
        <div class="stat-pill"><span class="stat-label">${t("slots")}:</span><span class="stat-val">${stats.totalHits}</span></div>
        <div class="stat-pill"><span class="stat-label">${t("checks")}:</span><span class="stat-val">${stats.totalChecks}</span></div>
      </div>
      <div class="golden-tip">💡 ${t("golden_tip")}</div>
    `;
  }

  // 2. 24h Distribution SVG Chart
  if (!stats.hasData) {
    cCard.innerHTML = `
      <div class="chart-head">
        <span class="chart-title">${t("chart_title")}</span>
      </div>
      <div class="chart-subtitle">${t("chart_subtitle")}</div>
      <div class="empty-notice">
        <div class="empty-icon">📊</div>
        <div class="empty-title">${t("chart_empty")}</div>
        <div class="empty-desc">${t("golden_empty_desc")}</div>
      </div>
    `;
  } else {
    const dist = stats.hourlyDistribution;
    let maxRate = 0;
    for (const item of dist) {
      if (item.rate > maxRate) maxRate = item.rate;
    }
    if (maxRate === 0) maxRate = 0.05;

    const chartW = 720;
    const chartH = 150;
    const barW = 20;
    const barGap = 8;
    const offsetX = 24;
    const maxBarH = 95;
    const baseY = 118;

    let barsSvg = "";
    let labelsSvg = "";

    for (let h = 0; h < 24; h++) {
      const item = dist[h];
      const barH = item.checks > 0 ? Math.max(3, (item.rate / maxRate) * maxBarH) : 3;
      const x = offsetX + h * (barW + barGap);
      const y = baseY - barH;
      const isPeak = stats.peakWindow && (h === stats.peakWindow.startHour);
      const fillColor = isPeak ? "#10b981" : (item.hits > 0 ? "#34d399" : "#22304a");
      const strokeColor = isPeak ? "#34d399" : "none";
      const hStr = String(h).padStart(2, "0");
      const tipText = `${hStr}:00–${String((h+1)%24).padStart(2,"0")}:00 | ${t("slots")}: ${item.hits}, ${t("checks")}: ${item.checks} (${(item.rate * 100).toFixed(1)}%)`;

      barsSvg += `<rect class="chart-bar" x="${x}" y="${y}" width="${barW}" height="${barH}" rx="3" fill="${fillColor}" stroke="${strokeColor}" stroke-width="${isPeak ? 1.5 : 0}" data-tip="${escapeHtml(tipText)}" data-hour="${h}">
        <title>${escapeHtml(tipText)}</title>

/* ---- Main Render ---- */
function render(){
  docs.sort((a,b) => a._t - b._t);
  const latestDoc = docs.length ? docs[docs.length - 1] : null;

  let updateTime = Date.now();
  if (latestDoc && latestDoc._t) {
    updateTime = latestDoc._t;
  } else if (compactData && compactData.updated_at) {
    const pt = parseT(compactData.updated_at);
    if (!isNaN(pt)) updateTime = pt;
  }

  const metaEl = document.getElementById("meta");
  if (metaEl) {
    metaEl.textContent = t("updated").replace("{t}", zhDT(updateTime)).replace("{r}", rel(Date.now() - updateTime));
  }
  setStale(Date.now() - updateTime > 45*60000);

  // Active appointment banner
  const availNow = (latestDoc && latestDoc.results ? latestDoc.results : [])
    .filter(r => Boolean(r.available || r.kind === "HAS_CITAS") && SHOW_PROVINCES.indexOf(String(r.province)) >= 0);
  setBanner(availNow.length ? availNow : null);

  renderAnalytics();
  renderCards(latestDoc);
  renderBoard();
  renderHistoryLog();

  if (!initialScrolled && typeof window !== "undefined" && window.innerWidth <= 768) {
    initialScrolled = true;
    const b = document.getElementById("board");
    if (b && b.scrollIntoView) b.scrollIntoView();
  }
}

/* ---- Extract last-known offices & earliest from docs + compact ---- */
function getLastKnownMeta(pid) {
  let lastOffices = null;
  let lastEarliest = null;
  let lastTime = 0;

  // 1. Scan in-memory docs (today's detailed data) — most recent first
  for (let i = docs.length - 1; i >= 0; i--) {
    const d = docs[i];
    for (const r of (d.results || [])) {
      if (String(r.province) !== String(pid)) continue;
      const isAvail = Boolean(r.available || r.kind === "HAS_CITAS");
      if (!isAvail) continue;
      const tm = parseT(r.checked_at) || d._t;

      // Extract offices
      let offices = [];
      if (Array.isArray(r.offices)) {
        offices = r.offices.filter(o => o && String(o).trim());
      } else if (typeof r.offices === "string" && r.offices.trim()) {
        offices = [r.offices.trim()];
      }

      // Extract earliest
      let earliestStr = null;
      if (r.earliest) {
        if (typeof r.earliest === "string") {
          earliestStr = r.earliest;
        } else if (typeof r.earliest === "object" && r.earliest !== null) {
          const d2 = r.earliest.date || "";
          const tm2 = r.earliest.time || "";
          earliestStr = (d2 + " " + tm2).trim();
        }
      }

      if (tm > lastTime && (offices.length || earliestStr)) {
        lastTime = tm;
        if (offices.length) lastOffices = offices;
        if (earliestStr) lastEarliest = earliestStr;
        break; // docs is sorted, most recent match is enough
      }
    }
  }

  // 2. Scan compact data for meta (4th element) — covers days beyond today
  if (compactData && compactData.provinces && compactData.provinces[pid]) {
    const pData = compactData.provinces[pid];
    const sortedDays = Object.keys(pData).sort().reverse();
    for (const dayKey of sortedDays) {
      const slots = pData[dayKey];
      const sortedSlots = Object.keys(slots).map(Number).sort((a, b) => b - a);
      for (const slotIdx of sortedSlots) {
        const triplet = slots[String(slotIdx)];
        if (!Array.isArray(triplet)) continue;
        const a = triplet[1] || 0;
        if (a <= 0) continue;

        // Check for meta (4th element)
        const meta = triplet.length >= 4 ? triplet[3] : null;
        if (meta && typeof meta === "object") {
          const h = Math.floor(slotIdx / 2);
          const m = (slotIdx % 2) * 30;
          // Rough timestamp for comparison
          const slotDate = new Date(dayKey + "T" + String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0") + ":00Z");
          const slotMs = slotDate.getTime();

          if (slotMs > lastTime) {
            if (meta.o && Array.isArray(meta.o) && meta.o.length) {
              lastOffices = meta.o;
            }
            if (meta.t) {
              lastEarliest = String(meta.t);
            }
            if (lastOffices || lastEarliest) {
              lastTime = slotMs;
            }
          }
        }
      }
      // If we found something, no need to go further back
      if (lastOffices || lastEarliest) break;
    }
  }

  return { offices: lastOffices, earliest: lastEarliest };
}

function card(r, lastHit){
  const isAvail = Boolean(r.available || r.kind === "HAS_CITAS");

  let cls = "no";
  let ripple = "";
  let st = t("st_no");

  if (isAvail) {
    cls = "ok";
    ripple = `<span class="radar-ripple"></span>`;
    st = t("st_ok");
  } else if (r.status === "error") {
    cls = "err";
    st = t("st_err");
  }

  let det = "";
  if (isAvail) {
    // Earliest compact capsule
    if (r.earliest) {
      let earliestStr = "";
      if (typeof r.earliest === "string") {
        earliestStr = r.earliest;
      } else if (typeof r.earliest === "object" && r.earliest !== null) {
        const d = r.earliest.date || "";
        const tm = r.earliest.time || "";
        earliestStr = (d + " " + tm).trim();
      }
      if (earliestStr) {
        const safeEarliest = escapeHtml(earliestStr);
        det += `<div class="capsule-earliest ok" title="📅 ${t("earliest_badge")}: ${safeEarliest}">📅 ${t("earliest_badge")}: ${safeEarliest}</div>`;
      }
    }

    // Offices lightweight badges with collapsible +N
    let rawOffices = [];
    if (typeof r.offices === "string" && r.offices.trim().length > 0) {
      rawOffices = [r.offices];
    } else if (Array.isArray(r.offices)) {
      rawOffices = r.offices;
    }
    const offices = [];
    const seenOff = new Set();
    for (const raw of rawOffices) {
      const o = (raw == null ? "" : String(raw)).trim();
      if (o && !seenOff.has(o)) {
        seenOff.add(o);
        offices.push(o);
      }
    }

    if (offices.length === 1) {
      const safeOff = escapeHtml(offices[0]);
      det += `<div class="offices-container"><div class="offices-row"><span class="office-tag" title="${safeOff}">🏢 ${safeOff}</span></div></div>`;
    } else if (offices.length > 1) {
      const first = offices[0];
      const rest = offices.slice(1);
      const restCount = rest.length;
      const provStr = String(r.province);
      const isExpanded = expandedOffices.has(provStr);
      const moreText = t("more_offices").replace("{n}", restCount);
      const btnText = isExpanded ? t("collapse_offices") : moreText;
      const displayStyle = isExpanded ? "flex" : "none";
      const ariaExpanded = isExpanded ? "true" : "false";
      const safeFirst = escapeHtml(first);
      const collapseTags = rest.map(o => {
        const safeO = escapeHtml(o);
        return `<span class="office-tag" title="${safeO}">🏢 ${safeO}</span>`;
      }).join("");
      det += `<div class="offices-container">
        <div class="offices-row">
          <span class="office-tag" title="${safeFirst}">🏢 ${safeFirst}</span>
          <button type="button" class="office-btn" data-prov="${escapeHtml(provStr)}" data-count="${restCount}" aria-expanded="${ariaExpanded}" aria-controls="offices-extra-${escapeHtml(provStr)}">${btnText}</button>
        </div>
        <div class="offices-collapse" id="offices-extra-${escapeHtml(provStr)}" style="display:${displayStyle}">${collapseTags}</div>
      </div>`;
    }
  } else if (r.status === "error" && r.error) {
    det += `<div class="err-msg">${escapeHtml((r.error + "").slice(0, 120))}</div>`;
  }

  // When currently no slots, show last-known offices & earliest from history
  if (!isAvail) {
    const known = getLastKnownMeta(String(r.province));
    if (known.offices || known.earliest) {
      let knownHtml = '<div class="last-known">';
      if (known.earliest) {
        knownHtml += `<div class="last-known-label">📅 ${t("last_known_earliest")}</div>`;
        knownHtml += `<div class="last-known-val">${escapeHtml(known.earliest)}</div>`;
      }
      if (known.offices && known.offices.length) {
        knownHtml += `<div class="last-known-label" style="margin-top:4px">🏢 ${t("last_known_offices")}</div>`;
        knownHtml += `<div class="last-known-val">${known.offices.map(o => escapeHtml(o)).join(' · ')}</div>`;
      }
      knownHtml += '</div>';
      det += knownHtml;
    }
  }

  const tm = parseT(r.checked_at);
  const provName = escapeHtml(r.province_name || r.province);
  const provId = escapeHtml(String(r.province));
  return `<div class="card ${cls}" id="card-${provId}">
    <div class="head"><span class="name">${provName}</span>
    <span class="at">${isNaN(tm) ? "" : zhDT(tm)}</span></div>
    <div class="state">${ripple}${st}</div>
    <div class="det">${det}</div>
    <div class="last">${t("last_hit")}${lastHit ? zhDT(lastHit) + "（" + rel(Date.now()-lastHit) + "）" : t("never")}</div>
  </div>`;
}

function renderCards(latestDoc){
  const lastHits = {};
  for (const d of docs) {
    for (const r of (d.results || [])){
      const isAvail = Boolean(r.available || r.kind === "HAS_CITAS");
      if (!isAvail || !r.province) continue;
      const tm = parseT(r.checked_at) || d._t;
      const pid = String(r.province);
      if (!lastHits[pid] || tm > lastHits[pid]) lastHits[pid] = tm;
    }
  }

  // Fallback metadata for default provinces
  const provMeta = {
    "28": { name: "Madrid", available: false, status: "ok" },
    "46": { name: "Valencia", available: false, status: "ok" }
  };

  const results = (latestDoc && latestDoc.results && latestDoc.results.length)
    ? latestDoc.results
    : SHOW_PROVINCES.map(p => ({
        province: p,
        province_name: provMeta[p].name,
        available: false,
        status: "ok",
        checked_at: new Date().toISOString()
      }));

  const filtered = results.filter(r => {
    if (SHOW_PROVINCES.indexOf(String(r.province)) < 0) return false;
    if (currentCity !== "all" && String(r.province) !== currentCity) return false;
    return true;
  });

  const cardsContainer = document.getElementById("cards");
  if (cardsContainer) {
    cardsContainer.innerHTML = filtered.map(r => card(r, lastHits[String(r.province)])).join("");
  }
}

/* ---- Continuous Green Ramp Interpolation ---- */
const GREEN_RAMP = [
  [155, 233, 168], // #9be9a8 (Stop 0: Less)
  [108, 198, 117], // #6cc675 (Stop 1)
  [64,  196, 99],  // #40c463 (Stop 2)
  [45,  164, 78],  // #2da44e (Stop 3)
  [26,  127, 55],  // #1a7f37 (Stop 4)
  [17,  99,  41]   // #116329 (Stop 5: More)
];
function greenRamp(tVal){
  const cl = Math.max(0, Math.min(1, tVal));
  const pos = cl * (GREEN_RAMP.length - 1);
  const idx = Math.min(Math.floor(pos), GREEN_RAMP.length - 2);
  const frac = pos - idx;
  const [r1, g1, b1] = GREEN_RAMP[idx];
  const [r2, g2, b2] = GREEN_RAMP[idx + 1];
  const r = Math.round(r1 + (r2 - r1) * frac);
  const g = Math.round(g1 + (g2 - g1) * frac);
  const b = Math.round(b1 + (b2 - b1) * frac);
  return `rgb(${r},${g},${b})`;
}

function slotLabel(j){
  const h = Math.floor(j/2), m = (j%2)*30, p = n => String(n).padStart(2,"0");
  return `${p(h)}:${p(m)}–${p(h + (m===30 ? 1 : 0))}:${p(m===30 ? 0 : 30)}`;
}
function rowLabel(key){
  const [,m,d] = key.split("-");
  const wd = I18N[lang].wd[new Date(key + "T12:00:00Z").getUTCDay()];
  return `${m}-${d} ${lang === "zh" ? "周" + wd : wd}`;
}

/* ---- Heatmap Board Rendering with Sticky Date Column ---- */
function renderBoard(){
  const todayKey = fmtDayKey.format(Date.now());
  const days = computePeriodDates(currentPeriod, Date.now());

  // Aggregate cells from compactData or docs
  const provs = new Map();
  const provNames = { "28": "Madrid", "46": "Valencia" };

  const targetProvs = (currentCity === "all") ? SHOW_PROVINCES : [currentCity];

  for (const pid of targetProvs) {
    provs.set(pid, { name: provNames[pid] || ((lang === "zh" ? "省 " : "Prov. ") + pid), cells: new Map() });
  }

  // Populate from compactData if available
  if (compactData && compactData.provinces) {
    for (const pid of targetProvs) {
      const pData = compactData.provinces[pid];
      if (!pData) continue;
      const targetObj = provs.get(pid);
      for (const [dayKey, slots] of Object.entries(pData)) {
        for (const [slotStr, triplet] of Object.entries(slots)) {
          const key = dayKey + "|" + slotStr;
          const c = Array.isArray(triplet) ? (triplet[0] || 0) : 0;
          const a = Array.isArray(triplet) ? (triplet[1] || 0) : 0;
          const e = Array.isArray(triplet) ? (triplet[2] || 0) : 0;
          const meta = (Array.isArray(triplet) && triplet.length >= 4 && typeof triplet[3] === "object") ? triplet[3] : null;
          const cellOffices = (meta && Array.isArray(meta.o)) ? meta.o.filter(x => x) : [];
          const cellEarliest = (meta && meta.t) ? String(meta.t) : "";
          targetObj.cells.set(key, { c, a, e, offices: cellOffices, earliest: cellEarliest });
        }
      }
    }
  }

  // Also incorporate any newer in-memory docs
  const seenCheck = new Set();
  for (const doc of docs) {
    for (const r of (doc.results || [])){
      if (!r.province || SHOW_PROVINCES.indexOf(String(r.province)) < 0) continue;
      if (currentCity !== "all" && String(r.province) !== currentCity) continue;
      let tt = parseT(r.checked_at);
      if (isNaN(tt)) tt = doc._t;
      const dk = r.province + "|" + tt;
      if (seenCheck.has(dk)) continue;
      seenCheck.add(dk);

      let o = provs.get(String(r.province));
      if (!o){
        o = { name: r.province_name || provNames[r.province] || ((lang === "zh" ? "省 " : "Prov. ") + r.province), cells: new Map() };
        provs.set(String(r.province), o);
      }
      const hm = fmtHM.format(tt);
      const j = (+hm.slice(0,2))*2 + (+hm.slice(3,5) >= 30 ? 1 : 0);
      const key = fmtDayKey.format(tt) + "|" + j;
      const c = o.cells.get(key) || {c:0, a:0, e:0, offices: [], earliest: ""};
      const checks = typeof r.checks_count === "number" ? r.checks_count : 1;
      const isAvail = Boolean(r.available || r.kind === "HAS_CITAS");
      const available = typeof r.available_count === "number" ? r.available_count : (isAvail ? 1 : 0);
      const errors = typeof r.error_count === "number" ? r.error_count : (r.status === "error" ? 1 : 0);

      c.c += checks;
      c.a += available;
      c.e += errors;

      if (r.offices) {
        if (!c.offices) c.offices = [];
        const rawOff = Array.isArray(r.offices) ? r.offices : (typeof r.offices === "string" ? [r.offices] : []);
        for (const off of rawOff) {
          const trimmed = (off == null ? "" : String(off)).trim().replace(/\|/g, "/");
          if (trimmed && !c.offices.includes(trimmed)) c.offices.push(trimmed);
        }
      }

      // Extract earliest from doc result
      if (r.earliest && isAvail) {
        let eStr = "";
        if (typeof r.earliest === "string") {
          eStr = r.earliest;
        } else if (typeof r.earliest === "object" && r.earliest !== null) {
          const ed = r.earliest.date || "";
          const etm = r.earliest.time || "";
          eStr = (ed + " " + etm).trim();
        }
        if (eStr) c.earliest = eStr;
      }

      o.cells.set(key, c);
    }
  }

  const ordered = SHOW_PROVINCES.filter(p => provs.has(p)).map(p => [p, provs.get(p)]);

  // Compute maximum appointment density for relative scaling (0.20 intensity floor)
  let maxDensity = 0;
  for (const [, o] of ordered){
    for (const c of o.cells.values()){
      if (c.a > 0 && c.c > 0){
        const d = c.a / c.c;
        if (d > maxDensity) maxDensity = d;
      }
    }
  }
  const scaleMax = Math.max(maxDensity, 0.20);

  let html = "";
  for (const [, o] of ordered){
    html += `<section class="city"><div class="chead">${o.name}</div>`;
    html += `<div class="heatmap-scroll-wrap"><div class="heatmap-grid">`;
    for (const day of days){
      let cells = "";
      for (let j = 0; j < 48; j++){
        const c = o.cells.get(day + "|" + j) || {c:0, a:0, e:0, offices: []};
        let bgStyle = "";
        let cls = "";
        let cellKind = "NONE";

        if (c.a > 0){
          const d = c.c > 0 ? (c.a / c.c) : 1;
          const rel = Math.min(1, d / scaleMax);
          bgStyle = ` style="background:${greenRamp(rel)}"`;
          cellKind = "REGULAR";
        } else if (c.e >= 6 || (c.c > 0 && (c.e / c.c) >= 0.5)){
          cls = " ce";
          cellKind = "ERROR";
        } else if (c.c > 0){
          cls = " cn";
          cellKind = "EMPTY";
        }

        const lab = `${rowLabel(day)} ${slotLabel(j)} ${o.name}`;
        const pct = c.c > 0 ? ` (${Math.round((c.a / c.c) * 100)}%)` : "";
        let cnt = `${t("checks")} ${c.c} · ${t("slots")} ${c.a}${pct}`;
        cnt += ` · ${t("errors")} ${c.e}`;
        if (c.offices && c.offices.length) {
          cnt += ` · ${t("offices_title")}: ${c.offices.join(" · ")}`;
        }
        if (c.earliest) {
          cnt += ` · ${t("earliest_badge")}: ${c.earliest}`;
        }

        const officesAttr = (c.offices && c.offices.length) ? escapeHtml(c.offices.join(" · ")) : "";
        const earliestAttr = c.earliest ? escapeHtml(c.earliest) : "";
        cells += `<span class="cell${cls}"${bgStyle} tabindex="0" role="button" aria-label="${escapeHtml(lab)}: ${escapeHtml(cnt)}" data-lab="${escapeHtml(lab)}" data-cnt="${escapeHtml(cnt)}" data-earliest="${earliestAttr}" data-t="${escapeHtml(lab)}|${escapeHtml(cnt)}|${c.c}|${c.a}|${c.e}|${escapeHtml(slotLabel(j))}|${escapeHtml(day)}|${c.a}|0" data-regular="${c.a}" data-available="${c.a}" data-kind="${cellKind}" data-offices="${officesAttr}" title="${escapeHtml(lab)}&#10;${escapeHtml(cnt)}"></span>`;
      }
      html += `<div class="row${day===todayKey ? " today" : ""}"><span class="rlabel sticky-col">${rowLabel(day)}</span><div class="cells">${cells}</div></div>`;
    }
    // Bottom hour marks: 00 / 06 / 12 / 18 / 24
    html += `<div class="row"><span class="rlabel sticky-col"></span><div class="cells hours">` +
      [0,12,24,36].map(j => `<span style="grid-column:${j+1}">${String(j/2).padStart(2,"0")}</span>`).join("") +
      `<span style="grid-column:48; justify-self:end">24</span>` +
      `</div></div>`;
    html += `</div></div></section>`;
  }

  const boardEl = document.getElementById("board");
  if (boardEl) boardEl.innerHTML = html;
}

/* ---- Historical Availability Log ---- */
function renderHistoryLog() {
  const logEl = document.getElementById("hist-log");
  if (!logEl) return;

  const provNames = { "28": "Madrid", "46": "Valencia", "8": "Barcelona" };
  const targetProvs = (currentCity === "all") ? SHOW_PROVINCES : [currentCity];

  // Collect availability records from docs (detailed data)
  const records = [];
  const seenKey = new Set(); // dedup by (province, checked_at)
  for (const d of docs) {
    for (const r of (d.results || [])) {
      const pid = String(r.province);
      if (targetProvs.indexOf(pid) < 0) continue;
      const isAvail = Boolean(r.available || r.kind === "HAS_CITAS");
      if (!isAvail) continue;

      const tm = parseT(r.checked_at) || d._t;
      if (isNaN(tm)) continue;

      const dk = pid + "|" + (r.checked_at || tm);
      if (seenKey.has(dk)) continue;
      seenKey.add(dk);

      // Extract offices
      let offices = [];
      if (Array.isArray(r.offices)) {
        offices = r.offices.filter(o => o && String(o).trim()).map(o => String(o).trim());
      } else if (typeof r.offices === "string" && r.offices.trim()) {
        offices = [r.offices.trim()];
      }

      // Extract earliest
      let earliestStr = "";
      if (r.earliest) {
        if (typeof r.earliest === "string") {
          earliestStr = r.earliest;
        } else if (typeof r.earliest === "object" && r.earliest !== null) {
          const ed = r.earliest.date || "";
          const etm = r.earliest.time || "";
          earliestStr = (ed + " " + etm).trim();
        }
      }

      records.push({
        time: tm,
        city: r.province_name || provNames[pid] || pid,
        offices: offices,
        earliest: earliestStr
      });
    }
  }

  // Also scan compact data for slots with meta — limited to current week
  const periodDays = new Set(computePeriodDates(currentPeriod));
  if (compactData && compactData.provinces) {
    for (const pid of targetProvs) {
      const pData = compactData.provinces && compactData.provinces[pid];
      if (!pData) continue;
      for (const [dayKey, slots] of Object.entries(pData)) {
        if (!periodDays.has(dayKey)) continue;
        for (const [slotStr, triplet] of Object.entries(slots)) {
          if (!Array.isArray(triplet)) continue;
          const a = triplet[1] || 0;
          if (a <= 0) continue;
          const meta = triplet.length >= 4 ? triplet[3] : null;
          const slotIdx = parseInt(slotStr, 10);
          const h = Math.floor(slotIdx / 2);
          const m = (slotIdx % 2) * 30;
          const slotDate = new Date(dayKey + "T" + String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0") + ":00+01:00");
          const slotMs = slotDate.getTime();
          if (isNaN(slotMs)) continue;

          // Check if this record already exists in docs-based records (dedup by approximate time)
          const isDup = records.some(rec => Math.abs(rec.time - slotMs) < 1800000 && rec.city === (provNames[pid] || pid));
          if (isDup) continue;

          const offices = (meta && Array.isArray(meta.o)) ? meta.o.filter(x => x) : [];
          const earliest = (meta && meta.t) ? String(meta.t) : "";

          // Only add if we have meaningful data (offices or earliest)
          if (offices.length || earliest) {
            records.push({
              time: slotMs,
              city: provNames[pid] || pid,
              offices: offices,
              earliest: earliest
            });
          }
        }
      }
    }
  }

  // Sort by time descending, limit to 30
  records.sort((a, b) => b.time - a.time);
  const display = records.slice(0, 30);

  if (display.length === 0) {
    logEl.innerHTML = `<div class="hist-section">
      <div class="hist-head">${t("hist_section_title")}</div>
      <div class="hist-desc">${t("hist_section_desc")}</div>
      <div class="hist-empty">${t("hist_no_records")}</div>
    </div>`;
    return;
  }

  let rows = "";
  for (const rec of display) {
    const timeStr = zhDT(rec.time);
    const agoStr = rel(Date.now() - rec.time);
    const offStr = rec.offices.length ? rec.offices.map(o => escapeHtml(o)).join("<br>") : "-";
    const earStr = rec.earliest ? escapeHtml(rec.earliest) : "-";
    rows += `<tr>
      <td>${escapeHtml(timeStr)}<br><span style="color:var(--mut);font-size:11px">${escapeHtml(agoStr)}</span></td>
      <td><span class="hist-tag-avail">${escapeHtml(rec.city)}</span></td>
      <td>${offStr}</td>
      <td>${earStr}</td>
    </tr>`;
  }

  logEl.innerHTML = `<div class="hist-section">
    <div class="hist-head">${t("hist_section_title")}</div>
    <div class="hist-desc">${t("hist_section_desc")}</div>
    <table class="hist-table">
      <thead><tr>
        <th>${t("hist_col_time")}</th>
        <th>${t("hist_col_city")}</th>
        <th>${t("hist_col_office")}</th>
        <th>${t("hist_col_earliest")}</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

/* ---- Interactive Inspection & Tooltip Popover ---- */
const brfEl = document.getElementById("brf");
if (brfEl) brfEl.onclick = () => load();

function isMobileView() {
  if (typeof window === "undefined") return false;
  if (typeof window.innerWidth === "number") {
    return window.innerWidth <= 768;
  }
  if (typeof window.matchMedia === "function") {
    try {
      const m = window.matchMedia("(max-width: 768px)");
      return Boolean(m && m.matches);
    } catch (_) {}
  }
  return false;
}

function renderCellInfoPlaceholder() {
  const info = document.getElementById("cellinfo");
  if (!info) return;
  if (isMobileView()) {
    info.style.display = "none";
    return;
  }
  info.classList.add("is-placeholder");
  info.innerHTML = `<div class="cellinfo-placeholder">
    <div class="cellinfo-placeholder-icon">🔍</div>
    <div class="cellinfo-placeholder-body">
      <div class="cellinfo-placeholder-title" data-i18n="cellinfo_guide">${escapeHtml(t("cellinfo_guide"))}</div>
      <div class="cellinfo-placeholder-desc" data-i18n="cellinfo_hint">${escapeHtml(t("cellinfo_hint"))}</div>
    </div>
  </div>`;
  info.style.display = "block";
}

function dismissCellInfo() {
  document.querySelectorAll(".cell.sel").forEach(x => x.classList.remove("sel"));
  const info = document.getElementById("cellinfo");
  if (!info) return;
  if (isMobileView()) {
    info.style.display = "none";
  } else {
    renderCellInfoPlaceholder();
  }
}

const boardEl = document.getElementById("board");
if (boardEl) {
  function formatCellInfo(cell) {
    if (!cell || typeof cell.getAttribute !== "function") return { tm: "", cnt: "" };
    const dataParts = (cell.getAttribute("data-t") || "").split("|");
    const tm = cell.getAttribute("data-lab") || dataParts[0] || "";
    let cnt = cell.getAttribute("data-cnt");
    if (!cnt && dataParts.length > 1) {
      if (dataParts.length >= 9) {
        cnt = dataParts.slice(1, -7).join("|");
      } else if (dataParts.length >= 7) {
        cnt = dataParts.slice(1, -5).join("|");
      } else {
        cnt = dataParts.slice(1).join("|");
      }
    }
    return { tm, cnt: cnt || "" };
  }

  function renderCellInfo(cell) {
    const info = document.getElementById("cellinfo");
    if (!info || !cell || typeof cell.getAttribute !== "function") return;

    const lab = cell.getAttribute("data-lab") || "";
    const rawEarliest = cell.getAttribute("data-earliest") || "";
    const earliest = (rawEarliest && rawEarliest !== "null" && rawEarliest !== "undefined") ? rawEarliest : "";
    const officesRaw = cell.getAttribute("data-offices") || "";
    const offices = officesRaw ? officesRaw.split(" · ").map(s => s.trim()).filter(s => s && s !== "null" && s !== "undefined") : [];
    const kind = cell.getAttribute("data-kind") || "NONE";
    const avail = parseInt(cell.getAttribute("data-available") || "0", 10) || 0;

    const dataParts = (cell.getAttribute("data-t") || "").split("|");
    let checks = 0, errors = 0, slot = "", day = "";
    if (dataParts.length >= 7) {
      checks = parseInt(dataParts[2] || "0", 10) || 0;
      errors = parseInt(dataParts[4] || "0", 10) || 0;
      slot = dataParts[5] || "";
      day = dataParts[6] || "";
    }

    const { tm } = formatCellInfo(cell);
    const titleText = (tm && tm !== "null" && tm !== "undefined") ? tm : ((lab && lab !== "null" && lab !== "undefined") ? lab : (((day + " " + slot).trim()) || (t("title") || "Cita Previa")));

    let html = `<div class="cellinfo-head">
    <div class="cellinfo-title">
      <span>📌 ${escapeHtml(titleText)}</span>
    </div>
    <button class="cellinfo-close" id="cellinfo-close-btn" aria-label="Close">✕</button>
  </div>`;

    let statusBadge = "";
    if (avail > 0 || kind === "REGULAR") {
      statusBadge = `<span class="cellinfo-badge-avail">${t("st_ok")}: ${avail}</span>`;
    } else if (kind === "ERROR" || errors > 0) {
      statusBadge = `<span class="cellinfo-badge-err">${t("st_err")}: ${errors}</span>`;
    } else if (checks > 0) {
      statusBadge = `<span class="cellinfo-badge-empty">${t("st_no")}</span>`;
    } else {
      statusBadge = `<span class="cellinfo-badge-empty">${t("lg_none")}</span>`;
    }

    html += `<div class="cellinfo-stats">
    ${statusBadge}
    <span>${t("checks")}: <b>${checks}</b></span>
    <span>${t("slots")}: <b>${avail}</b></span>
    <span>${t("errors")}: <b>${errors}</b></span>
    ${earliest ? `<span class="capsule-earliest ok">⚡ ${t("earliest")}: ${escapeHtml(earliest)}</span>` : ""}
  </div>`;

    if (offices.length > 0) {
      html += `<div class="cellinfo-section">
      <div class="cellinfo-section-title">🏛️ ${t("offices_title")} (${offices.length}):</div>
      <div class="cellinfo-offices">
        ${offices.map(o => `<span class="office-tag">${escapeHtml(o)}</span>`).join("")}
      </div>
    </div>`;
    }

    info.classList.remove("is-placeholder");
    info.innerHTML = html;
    info.style.display = "block";

    const closeBtn = document.getElementById("cellinfo-close-btn");
    if (closeBtn) {
      closeBtn.onclick = (e) => {
        e.stopPropagation();
        dismissCellInfo();
      };
    }
  }

  /* Touch & Scroll Discrimination */
  let touchStartX = 0;
  let touchStartY = 0;
  let isTouchScrolling = false;
  let touchScrollTimeout = null;
  let scrollDebounceTimer = null;
  let isGridScrolling = false;

  boardEl.addEventListener("touchstart", e => {
    if (e.touches && e.touches.length === 1) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      isTouchScrolling = false;
      clearTimeout(touchScrollTimeout);
    }
  }, { passive: true });

  boardEl.addEventListener("touchmove", e => {
    if (e.touches && e.touches.length === 1) {
      const dx = Math.abs(e.touches[0].clientX - touchStartX);
      const dy = Math.abs(e.touches[0].clientY - touchStartY);
      if (dx > 8 || dy > 8) {
        isTouchScrolling = true;
      }
    }
  }, { passive: true });

  boardEl.addEventListener("touchend", e => {
    if (isTouchScrolling) {
      touchScrollTimeout = setTimeout(() => {
        isTouchScrolling = false;
      }, 250);
    }
  }, { passive: true });

  boardEl.addEventListener("scroll", e => {
    if (e.target && e.target.classList && e.target.classList.contains("heatmap-scroll-wrap")) {
      isGridScrolling = true;
      clearTimeout(scrollDebounceTimer);
      scrollDebounceTimer = setTimeout(() => {
        isGridScrolling = false;
      }, 150);
    }
  }, true);

  boardEl.addEventListener("click", e => {
    if (isTouchScrolling || isGridScrolling) {
      isTouchScrolling = false;
      return;
    }

    const cell = e.target.closest(".cell");
    if (!cell) {
      if (!e.target.closest(".heatmap-scroll-wrap")) {
        dismissCellInfo();
      }
      return;
    }

    document.querySelectorAll(".cell.sel").forEach(x => x.classList.remove("sel"));
    cell.classList.add("sel");
    renderCellInfo(cell);
  });

  // Fast hover inspect tooltip (<50ms)
  boardEl.addEventListener("mouseover", e => {
    if (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) return;
    const cell = e.target.closest(".cell");
    if (!cell) return;
    renderCellInfo(cell);
  });

  boardEl.addEventListener("mouseleave", e => {
    if (isMobileView()) return;
    if (e && e.relatedTarget && (e.relatedTarget.closest("#cellinfo") || e.relatedTarget.closest("#cellinfo-zone"))) {
      return;
    }
    const hasSelected = document.querySelector(".cell.sel");
    if (hasSelected) {
      renderCellInfo(hasSelected);
    } else {
      renderCellInfoPlaceholder();
    }
  });

  // Keyboard navigation & accessibility
  boardEl.addEventListener("focusin", e => {
    const cell = e.target.closest(".cell");
    if (!cell) return;
    renderCellInfo(cell);
  });

  boardEl.addEventListener("focusout", e => {
    if (isMobileView()) return;
    if (e && e.relatedTarget && (e.relatedTarget.closest("#cellinfo") || e.relatedTarget.closest("#cellinfo-zone") || e.relatedTarget.closest("#board"))) {
      return;
    }
    const hasSelected = document.querySelector(".cell.sel");
    if (hasSelected) {
      renderCellInfo(hasSelected);
    } else {
      renderCellInfoPlaceholder();
    }
  });

  boardEl.addEventListener("keydown", e => {
    const cell = e.target.closest(".cell");
    if (!cell) return;
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      document.querySelectorAll(".cell.sel").forEach(x => x.classList.remove("sel"));
      cell.classList.add("sel");
      renderCellInfo(cell);
    }
  });
}

const cellinfoZoneEl = document.getElementById("cellinfo-zone");
if (cellinfoZoneEl) {
  cellinfoZoneEl.addEventListener("mouseleave", e => {
    if (isMobileView()) return;
    if (e && e.relatedTarget && e.relatedTarget.closest("#board")) {
      return;
    }
    const hasSelected = document.querySelector(".cell.sel");
    if (hasSelected) {

  cellinfoZoneEl.addEventListener("focusout", e => {
    if (isMobileView()) return;
    if (e && e.relatedTarget && (e.relatedTarget.closest("#board") || e.relatedTarget.closest("#cellinfo-zone"))) {
      return;
    }
    const hasSelected = document.querySelector(".cell.sel");
    if (hasSelected) {
      renderCellInfo(hasSelected);
    } else {
      renderCellInfoPlaceholder();
    }
  });
}

/* Tap outside listener */
document.addEventListener("click", e => {
  const info = document.getElementById("cellinfo");
  if (!info || info.style.display === "none") return;
  if (e.target.closest("#cellinfo")) return;
  if (e.target.closest(".cell")) return;

// City selector pills handler
const cityPillsContainer = document.getElementById("city-pills");
if (cityPillsContainer) {

    renderAnalytics();
    renderHistoryLog();

const periodPillsContainer = document.getElementById("period-pills");
if (periodPillsContainer) {

// Language buttons handler
document.querySelectorAll("[data-lang]").forEach(b => {
  b.onclick = () => {
    lang = b.dataset.lang;
    safeSetStorage("lang", lang);
    dismissCellInfo();
    applyStatic();
    const hasData = (compactData && compactData.provinces && Object.keys(compactData.provinces).length > 0) || docs.length > 0;
    if (hasData) render();
    else load();
  };
});

// Office toggle button handler
const cardsContainerEl = document.getElementById("cards");
if (cardsContainerEl) {
  cardsContainerEl.addEventListener("click", e => {
    const btn = e.target.closest(".office-btn");
    if (!btn) return;
    e.stopPropagation();
    const prov = String(btn.dataset.prov);
    const extra = document.getElementById("offices-extra-" + prov);
    if (!extra) return;
    const isHidden = extra.style.display === "none" || !extra.style.display;
    if (isHidden) {
      extra.style.display = "flex";
      btn.setAttribute("aria-expanded", "true");
      btn.textContent = t("collapse_offices");
      expandedOffices.add(prov);
    } else {
      extra.style.display = "none";
      btn.setAttribute("aria-expanded", "false");
      const count = btn.dataset.count;
      btn.textContent = t("more_offices").replace("{n}", count);
      expandedOffices.delete(prov);
    }
  });
}

if (typeof window !== "undefined") {
  let prevIsMobile = isMobileView();
  window.addEventListener("resize", () => {
    const currentIsMobile = isMobileView();
    if (currentIsMobile !== prevIsMobile) {
      prevIsMobile = currentIsMobile;
      const hasSelected = document.querySelector(".cell.sel");
      if (hasSelected) {
        renderCellInfo(hasSelected);
      } else {
        dismissCellInfo();
      }
    }
  });

  window._cita = { render, renderCards, renderBoard, renderHistoryLog, card, computeGoldenHoursAnalytics, renderAnalytics, getWeekdayLabel, getLastKnownMeta, I18N, t, SHOW_PROVINCES, expandedOffices, escapeHtml, setBanner, dismissCellInfo, renderCellInfoPlaceholder, isMobileView };
}

setInterval(load, 60000);
applyStatic();
load();
