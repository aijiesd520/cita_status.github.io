<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cita Previa 4010 放号监控</title>
<style>
  :root {
    --bg:#f6f8fa; --card:#fff; --line:#d0d7de; --txt:#1f2328; --mut:#656d76;
    --cw:11px; --cg:2px; --lw:86px;
    --g1:#9be9a8; --g2:#6cc675; --g3:#40c463; --g4:#2da44e; --g5:#1a7f37; --g6:#116329;
    --ce:#cf222e; --cn:#57606a; --cx:#ebedf0;
  }
  @media (max-width: 760px) {
    :root { --cw: max(5px, calc((100vw - 148px)/48)); --cg:1px; --lw:74px; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:14px; background:var(--bg); color:var(--txt);
         font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; font-size:15px; }
  h1 { font-size:19px; margin:0 0 2px; }
  .sub { font-size:12px; color:var(--mut); font-weight:normal; }
  #meta { font-size:13px; color:var(--mut); margin:2px 0 10px; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; align-items:center; }
  button, .gh-link { border:1px solid var(--line); background:var(--card); border-radius:6px;
           padding:5px 12px; font-size:13px; cursor:pointer; color:var(--txt); text-decoration:none;
           display:inline-flex; align-items:center; }
  button.on { background:#1f2328; color:#fff; border-color:#1f2328; }
  .gh-link:hover { background:#eaeef2; }
  #banner { display:none; background:#1a7f37; color:#fff; border-radius:8px;
            padding:10px 14px; font-size:16px; font-weight:600; margin-bottom:10px; }
  #banner a { color:#fff; text-decoration:underline; margin-right:14px; }
  #stale { display:none; background:#fff8c6; color:#6b5300; border:1px solid #e6d178;
           border-radius:6px; padding:8px 12px; font-size:13px; margin-bottom:10px; }
  #legend { display:flex; flex-wrap:wrap; gap:6px 12px; font-size:12px; color:var(--mut);
            margin:0 0 10px; align-items:center; }
  .leg-scale { display:inline-flex; align-items:center; gap:4px; }
  .sw-grad { display:inline-block; width:64px; height:11px; border-radius:2px; margin:0 4px;
             vertical-align:-1px; background:linear-gradient(to right, var(--g1), var(--g2), var(--g3), var(--g4), var(--g5), var(--g6)); }
  .sw { display:inline-block; width:11px; height:11px; border-radius:2px; margin-right:4px;
        vertical-align:-1px; background:var(--cx); }
  #cellinfo { display:none; background:var(--card); border:1px solid var(--line);
              border-radius:6px; padding:6px 10px; font-size:13px; margin-bottom:10px; }
  #cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
           gap:10px; margin-bottom:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:12px 14px; }
  .card .head { display:flex; justify-content:space-between; align-items:baseline; }
  .card .name { font-size:15px; font-weight:700; }
  .card .at { font-size:12px; color:var(--mut); }
  .card .state { font-size:18px; font-weight:700; margin:5px 0 3px; color:#57606a; }
  .card .det { font-size:13px; line-height:1.55; color:#424a53; }
  .card .last { font-size:12px; color:var(--mut); margin-top:6px; border-top:1px dashed var(--line); padding-top:6px; }
  .card.ok .state { color:#1a7f37; }
  .card.err .state { color:#cf222e; }
  .city { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:12px; margin-bottom:12px; overflow-x:auto; }
  .chead { font-size:15px; font-weight:700; margin-bottom:8px; }
  .row { display:flex; align-items:center; margin-bottom:var(--cg); }
  .rlabel { flex:none; width:var(--lw); font-size:12px; color:var(--mut); white-space:nowrap; }
  .row.today .rlabel { color:#1a7f37; font-weight:700; }
  .cells { display:grid; grid-template-columns:repeat(48, var(--cw)); gap:var(--cg); }
  .cell { width:var(--cw); height:var(--cw); border-radius:3px; background:var(--cx); cursor:pointer; }
  .g1{background:var(--g1)} .g2{background:var(--g2)} .g3{background:var(--g3)}
  .g4{background:var(--g4)} .g5{background:var(--g5)} .g6{background:var(--g6)}
  .ce{background:var(--ce)} .cn{background:var(--cn)}
  .cell.sel { outline:2px solid #0969da; outline-offset:1px; }
  .hours { margin-top:2px; }
  .hours span { font-size:10px; color:var(--mut); }
  footer { font-size:12px; color:var(--mut); margin-top:8px; line-height:1.7; }
  #msg { padding:20px; text-align:center; color:var(--mut); background:var(--card);
         border:1px solid var(--line); border-radius:10px; margin-bottom:12px; }
</style>
</head>
<body>
<h1>Cita Previa 4010 <span class="sub" data-i18n="subtitle"></span></h1>
<div id="meta">…</div>
<div class="controls">
  <button id="brf" data-i18n="refresh"></button>
  <button data-lang="zh">中文</button>
  <button data-lang="en">EN</button>
  <button data-lang="es">ES</button>
  <a href="https://github.com/aijiesd520/cita_status.github.io" target="_blank" rel="noopener noreferrer" class="gh-link" data-i18n="github_link"></a>
</div>
<div id="banner"></div>
<div id="stale"></div>
<div id="legend">
  <span class="leg-scale">
    <span data-i18n="lg_slots"></span>:
    <span data-i18n="lg_less"></span>
    <span class="sw-grad"></span>
    <span data-i18n="lg_more"></span>
  </span>
  <span><span class="sw" style="background:var(--ce)"></span><span data-i18n="lg_err"></span></span>
  <span><span class="sw" style="background:var(--cn)"></span><span data-i18n="lg_no"></span></span>
  <span><span class="sw"></span><span data-i18n="lg_none"></span></span>
</div>
<div id="cellinfo"></div>
<div id="msg" hidden></div>
<main id="cards"></main>
<div id="board"></div>
<footer data-i18n="footer"></footer>
<script>
"use strict";
const MAD = "Europe/Madrid";
const fmtHM    = new Intl.DateTimeFormat("es-ES", {timeZone:MAD, hour:"2-digit", minute:"2-digit", hourCycle:"h23"});
const fmtDayKey= new Intl.DateTimeFormat("en-CA", {timeZone:MAD});   // YYYY-MM-DD

let docs = [];             // 已加载的每轮文档, _t = epoch ms

/* ---- i18n: zh / en / es ---- */
const I18N = {
  zh: {
    title: "Cita Previa 4010 放号监控",
    subtitle: "按指纹 · 每 1 分钟探测 · 马德里时间",
    refresh: "刷新", loading: "加载中…", nodata: "暂无数据, 等待第一轮采集…",
    loadfail: "加载数据失败, 60 秒后自动重试",

    stale: "⚠ 数据已超过 45 分钟未更新, 监控可能中断",
    updated: "数据更新 {t}（马德里 · {r}）",
    github_link: "⭐ GitHub 仓库",
    lg_slots: "有号", lg_less: "少", lg_more: "多",
    lg_err: "检查出错", lg_no: "无号", lg_none: "未采集/无数据",
    has_slots: "有号！", earliest: "最早", office: "地点",
    st_ok: "有号 HAY CITA", st_err: "检查出错", st_no: "无号 NO HAY CITA",
    last_hit: "最近一次有号: ", never: "从未记录到",
    just_now: "刚刚", min_ago: "{n} 分钟前", hour_ago: "{n} 小时前", day_ago: "{n} 天前",
    checks: "检查", slots: "有号", errors: "错误",
    wd: ["日","一","二","三","四","五","六"],
    footer: "每行 = 一天（48 格 × 30 分钟，从 00:00 到 24:00），最上一行是 6 天前，最下一行是今天；悬停看详情，手机点按格子看详情。每 60 秒自动刷新；GitHub Pages 缓存最多延迟 10 分钟。<br>本页为社区公益信息展示，数据来自对公众预约系统可用性的被动探测，与任何官方机构无关；能否预约以官网为准。"
  },
  en: {
    title: "Cita Previa 4010 Slot Monitor",
    subtitle: "Fingerprinting · 1-min checks · Madrid time",
    refresh: "Refresh", loading: "Loading…", nodata: "No data yet — waiting for the first round…",
    loadfail: "Failed to load data — retrying in 60 s",
    filehint: "file:// cannot read the data file — open via GitHub Pages, or run python -m http.server here and open http://127.0.0.1:8000",
    stale: "⚠ No update for over 45 minutes — the monitor may be down",
    updated: "Updated {t} (Madrid · {r})",
    github_link: "⭐ GitHub Repo",
    lg_slots: "Slots", lg_less: "Less", lg_more: "More",
    lg_err: "Errors", lg_no: "No slots", lg_none: "No data",
    has_slots: "has slots!", earliest: "Earliest", office: "Office",
    st_ok: "SLOTS AVAILABLE", st_err: "Check error", st_no: "NO SLOTS",
    last_hit: "Last available: ", never: "never recorded",
    just_now: "just now", min_ago: "{n} min ago", hour_ago: "{n} h ago", day_ago: "{n} days ago",
    checks: "checks", slots: "slots", errors: "errors",
    wd: ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],
    footer: "Each row = one day (48 cells × 30 min, 00:00–24:00); top row is 6 days ago, bottom row is today. Hover for details; tap a cell on mobile. Auto-refresh every 60 s; GitHub Pages cache may delay updates up to 10 minutes.<br>This is a community, non-profit information page. Data comes from passive availability checks of the public booking system and is not affiliated with any authority; bookings must be made on the official site."
  },
  es: {
    title: "Monitor de citas Cita Previa 4010",
    subtitle: "Toma de huellas · sondeo cada 1 min · hora de Madrid",
    refresh: "Actualizar", loading: "Cargando…", nodata: "Sin datos todavía — esperando la primera ronda…",
    loadfail: "No se pudieron cargar los datos — reintentando en 60 s",
    filehint: "file:// no puede leer el archivo de datos — abra por GitHub Pages, o ejecute python -m http.server aquí y abra http://127.0.0.1:8000",
    stale: "⚠ Más de 45 minutos sin actualizaciones — el monitor puede estar caído",
    updated: "Actualizado {t} (Madrid · {r})",
    github_link: "⭐ Repositorio GitHub",
    lg_slots: "Citas", lg_less: "Menos", lg_more: "Más",
    lg_err: "Errores", lg_no: "No hay cita", lg_none: "Sin datos",
    has_slots: "¡tiene cita!", earliest: "Lo antes", office: "Oficina",
    st_ok: "HAY CITA", st_err: "Error de comprobación", st_no: "NO HAY CITA",
    last_hit: "Última cita: ", never: "nunca registrada",
    just_now: "ahora mismo", min_ago: "hace {n} min", hour_ago: "hace {n} h", day_ago: "hace {n} días",
    checks: "comprob.", slots: "citas", errors: "errores",
    wd: ["dom","lun","mar","mié","jue","vie","sáb"],
    footer: "Cada fila = un día (48 celdas × 30 min, 00:00–24:00); la fila superior es de hace 6 días, la inferior es hoy. Pase el ratón para ver detalles; toque una celda en el móvil. Se actualiza cada 60 s; la caché de GitHub Pages puede retrasar hasta 10 minutos.<br>Esta es una página informativa comunitaria sin ánimo de lucro. Los datos provienen de comprobaciones pasivas de disponibilidad del sistema público de citas y no están afiliados a ninguna autoridad; la cita debe solicitarse en la web oficial."
  }
};
let lang = localStorage.getItem("lang");
if (!lang) {
  const n = (navigator.language || "").toLowerCase();
  lang = n.startsWith("es") ? "es" : (n.startsWith("zh") ? "zh" : "en");
}
const t = k => (I18N[lang][k] ?? I18N.en[k] ?? k);

function applyStatic(){
  document.title = t("title");
  document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.innerHTML = t(el.dataset.i18n); });
  document.querySelectorAll("[data-lang]").forEach(b =>
    b.classList.toggle("on", b.dataset.lang === lang));
}
function parseT(s){        // "2026-09-02T08:01:12+0100" -> epoch ms (+HHMM 归一为 +HH:MM)
  if (!s) return NaN;
  return Date.parse(String(s).trim().replace(/([+-]\d\d)(\d\d)$/, "$1:$2"));
}
function zhDT(t_){         // epoch ms -> 无歧义 "09-02 01:04"（马德里墙钟）
  return fmtDayKey.format(t_).slice(5) + " " + fmtHM.format(t_);
}
function rel(ms){
  const m = Math.floor(ms/60000);
  if (m < 1)  return t("just_now");
  if (m < 60) return t("min_ago").replace("{n}", m);
  const h = Math.floor(m/60);
  if (h < 48) return t("hour_ago").replace("{n}", h);
  return t("day_ago").replace("{n}", Math.floor(h/24));
}
function utcKeysBack(n){
  const out = [], now = Date.now();
  for (let i = 0; i <= n; i++){
    const d = new Date(now - i*86400000);
    out.push(d.getUTCFullYear() + String(d.getUTCMonth()+1).padStart(2,"0") + String(d.getUTCDate()).padStart(2,"0"));
  }
  return out;
}
async function fetchDay(key, bust){
  const r = await fetch("d/" + key + ".jsonl" + (bust ? "?t=" + Date.now() : ""));
  if (!r.ok) return;                       // 404 = 该日尚无数据, 正常
  const txt = await r.text();
  for (const line of txt.split(/\r?\n/)){
    if (!line.trim()) continue;
    try {
      const d = JSON.parse(line);          // 容忍写入中断的坏末行
      d._t = parseT(d.generated_at);
      if (!isNaN(d._t)) docs.push(d);
    } catch (e) {}
  }
}
async function load(){
  docs = [];
  let fail = 0;
  const days = utcKeysBack(7);             // 7 个马德里日最坏横跨 8 个 UTC 文件
  await Promise.all(days.map((k, i) =>
    fetchDay(k, i === 0).catch(() => { fail++; })));   // 今天破缓存, 历史日期走 HTTP 缓存
  const msg = document.getElementById("msg");
  msg.hidden = true;
  document.getElementById("cellinfo").style.display = "none";
  if (!docs.length){
    document.getElementById("cards").innerHTML = "";
    document.getElementById("board").innerHTML = "";
    setBanner(null); setStale(false);
    msg.hidden = false;
    msg.textContent = location.protocol === "file:"
      ? t("filehint")
      : (fail === days.length ? t("loadfail") : t("nodata"));
    document.getElementById("meta").textContent = t("nodata");
    return;
  }
  render();
}

/* ---- 渲染 ---- */

function render(){
  docs.sort((a,b) => a._t - b._t);
  const latest = docs[docs.length - 1];
  document.getElementById("meta").textContent =
    t("updated").replace("{t}", zhDT(latest._t)).replace("{r}", rel(Date.now()-latest._t));
  setStale(Date.now() - latest._t > 45*60000);
  const availNow = (latest.results || []).filter(r => r.available);
  setBanner(availNow.length ? availNow : null);
  renderCards(latest);
  renderBoard();
}
function setBanner(list){
  const b = document.getElementById("banner");
  if (!list){ b.style.display = "none"; return; }
  b.style.display = "block";
  b.innerHTML = list.map(r =>
    `<a href="#card-${r.province}">📍 ${r.province_name || r.province} ${t("has_slots")}` +
    (r.earliest ? ` ${t("earliest")}: ${r.earliest.date || ""} ${r.earliest.time || ""}` : "") + "</a>").join("");
}
function setStale(on){
  const s = document.getElementById("stale");
  s.style.display = on ? "block" : "none";
  if (on) s.textContent = t("stale");
}
function card(r, lastHit){
  const cls = r.available ? "ok" : (r.status === "error" ? "err" : "no");
  const st  = r.available ? t("st_ok") : r.status === "error" ? t("st_err") : t("st_no");
  let det = "";
  if (r.available){
    if (r.earliest) det += t("earliest") + ": " + (r.earliest.date || "?") + " " + (r.earliest.time || "") + "<br>";
    if (r.offices && r.offices.length) det += t("office") + ": " + r.offices.join(" · ") + "<br>";
  } else if (r.status === "error" && r.error){
    det += (r.error + "").slice(0, 120) + "<br>";
  }
  const tm = parseT(r.checked_at);
  return `<div class="card ${cls}" id="card-${r.province}">
    <div class="head"><span class="name">${r.province_name || r.province}</span>
    <span class="at">${isNaN(tm) ? "" : zhDT(tm)}</span></div>
    <div class="state">${st}</div>
    <div class="det">${det}</div>
    <div class="last">${t("last_hit")}${lastHit ? zhDT(lastHit) + "（" + rel(Date.now()-lastHit) + "）" : t("never")}</div>
  </div>`;
}
function renderCards(latest){
  const lastHits = {};                     // 每省最近一次 available 的时间
  for (const d of docs) for (const r of (d.results || [])){
    if (!r.available || !r.province) continue;
    const tm = parseT(r.checked_at) || d._t;
    if (!lastHits[r.province] || tm > lastHits[r.province]) lastHits[r.province] = tm;
  }
  document.getElementById("cards").innerHTML =
    (latest.results || []).map(r => card(r, lastHits[r.province])).join("");
}

/* ---- 贡献图: 每城 7 行(天, 旧→新自上而下, 今天最底) × 48 列(30 分钟, 00:00→24:00) ---- */

function slotLabel(j){
  const h = Math.floor(j/2), m = (j%2)*30, p = n => String(n).padStart(2,"0");
  return `${p(h)}:${p(m)}–${p(h + (m===30 ? 1 : 0))}:${p(m===30 ? 0 : 30)}`;
}
function rowLabel(key, todayKey){          // "YYYY-MM-DD" -> "09-01 周二 / Tue / mar"
  const [,m,d] = key.split("-");
  const wd = I18N[lang].wd[new Date(key + "T12:00:00Z").getUTCDay()];
  return `${m}-${d} ${lang === "zh" ? "周" + wd : wd}`;
}
// 连续绿色渐变色阶插值定义 (Less #9be9a8 -> More #116329)
const GREEN_RAMP = [
  [155, 233, 168], // #9be9a8 (Stop 0: Less)
  [108, 198, 117], // #6cc675 (Stop 1)
  [64,  196, 99],  // #40c463 (Stop 2)
  [45,  164, 78],  // #2da44e (Stop 3)
  [26,  127, 55],  // #1a7f37 (Stop 4)
  [17,  99,  41]   // #116329 (Stop 5: More)
];
function greenRamp(tVal){
  const cl = Math.max(0, Math.min(1, tVal));
  const pos = cl * (GREEN_RAMP.length - 1);
  const idx = Math.min(Math.floor(pos), GREEN_RAMP.length - 2);
  const frac = pos - idx;
  const [r1, g1, b1] = GREEN_RAMP[idx];
  const [r2, g2, b2] = GREEN_RAMP[idx + 1];
  const r = Math.round(r1 + (r2 - r1) * frac);
  const g = Math.round(g1 + (g2 - g1) * frac);
  const b = Math.round(b1 + (b2 - b1) * frac);
  return `rgb(${r},${g},${b})`;
}

function renderBoard(){
  const todayKey = fmtDayKey.format(Date.now());
  const [ty,tm,td] = todayKey.split("-").map(Number);
  const days = [];                         // [6天前, ..., 昨天, 今天] 旧→新自上而下
  for (let k = 6; k >= 0; k--)
    days.push(new Date(Date.UTC(ty, tm-1, td) - k*86400000).toISOString().slice(0,10));

  // 每省聚合: cells["day|j"] = {c:检查, a:有号, e:错误} —— 马德里墙钟落格
  const provs = new Map();
  for (const doc of docs) for (const r of (doc.results || [])){
    if (!r.province) continue;
    let o = provs.get(r.province);
    if (!o){
      o = {name: r.province_name || ("省 " + r.province), cells: new Map()};
      provs.set(r.province, o);
    }
    let tt = parseT(r.checked_at);
    if (isNaN(tt)) tt = doc._t;
    const hm = fmtHM.format(tt);
    const j = (+hm.slice(0,2))*2 + (+hm.slice(3,5) >= 30 ? 1 : 0);
    const key = fmtDayKey.format(tt) + "|" + j;
    const c = o.cells.get(key) || {c:0, a:0, e:0};
    const checks = typeof r.checks_count === "number" ? r.checks_count : 1;
    const available = typeof r.available_count === "number" ? r.available_count : (r.available ? 1 : 0);
    const errors = typeof r.error_count === "number" ? r.error_count : (r.status === "error" ? 1 : 0);
    c.c += checks;
    c.a += available;
    c.e += errors;
    o.cells.set(key, c);
  }
  const latestDoc = docs.length ? docs[docs.length-1] : null;
  const order = (latestDoc && latestDoc.results ? latestDoc.results : []).map(r => r.province);   // 城市序=最新一轮
  const ordered = [...provs.entries()].sort((a,b) => order.indexOf(a[0]) - order.indexOf(b[0]));

  // 计算当前全局最大有号密度 (用于动态相对渐变归一化)
  let maxDensity = 0;
  for (const [, o] of ordered){
    for (const c of o.cells.values()){
      if (c.a > 0 && c.c > 0){
        const d = c.a / c.c;
        if (d > maxDensity) maxDensity = d;
      }
    }
  }
  const scaleMax = Math.max(maxDensity, 0.20);

  let html = "";
  for (const [, o] of ordered){
    html += `<section class="city"><div class="chead">${o.name}</div>`;
    for (const day of days){
      const [,m2,d2] = day.split("-");
      let cells = "";
      for (let j = 0; j < 48; j++){
        const c = o.cells.get(day + "|" + j) || {c:0, a:0, e:0};
        let bgStyle = "";
        let cls = "";
        if (c.a > 0){
          const d = c.c > 0 ? (c.a / c.c) : 1;
          const rel = Math.min(1, d / scaleMax);
          bgStyle = ` style="background:${greenRamp(rel)}"`;
        } else if (c.e >= 6 || (c.c > 0 && (c.e / c.c) >= 0.5)){
          cls = " ce";
        } else if (c.c > 0){
          cls = " cn";
        }
        const lab = `${rowLabel(day)} ${slotLabel(j)} Madrid`;
        const pct = c.c > 0 ? ` (${Math.round((c.a / c.c) * 100)}%)` : "";
        const cnt = `${t("checks")} ${c.c} · ${t("slots")} ${c.a}${pct} · ${t("errors")} ${c.e}`;
        cells += `<span class="cell${cls}"${bgStyle} data-t="${lab}|${cnt}" title="${lab}&#10;${cnt}"></span>`;
      }
      html += `<div class="row${day===todayKey ? " today" : ""}"><span class="rlabel">${rowLabel(day)}</span><div class="cells">${cells}</div></div>`;
    }
    // 底部小时刻度: 00 / 06 / 12 / 18 / 24
    html += `<div class="row"><span class="rlabel"></span><div class="cells hours">` +
      [0,12,24,36].map(j => `<span style="grid-column:${j+1}">${String(j/2).padStart(2,"0")}</span>`).join("") +
      `<span style="grid-column:48; justify-self:end">24</span>` +
      `</div></div>`;
    html += `</section>`;
  }
  document.getElementById("board").innerHTML = html;
}

/* ---- 交互: 悬停 title + 手机点按详情条 ---- */
document.getElementById("brf").onclick = () => load();
document.getElementById("board").addEventListener("click", e => {
  const cell = e.target.closest(".cell");
  const info = document.getElementById("cellinfo");
  if (!cell){ info.style.display = "none"; return; }
  document.querySelectorAll(".cell.sel").forEach(x => x.classList.remove("sel"));
  cell.classList.add("sel");
  const [tm, cnt] = cell.getAttribute("data-t").split("|");
  info.textContent = "📌 " + tm + " —— " + cnt;
  info.style.display = "block";
});
document.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => {
  lang = b.dataset.lang;
  localStorage.setItem("lang", lang);
  applyStatic();
  if (docs.length) render();               // 空数据也要刷新提示文案
  else load();
});
setInterval(load, 60000);
applyStatic();
load();
</script>
